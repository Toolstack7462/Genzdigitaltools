        <meta property="og:image" content="/logo-genz-digital-store.png" />

        <!-- Twitter Card -->
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="Gen Z Digital Store | All-in-One AI & Digital Tools Hub" />
        <meta name="twitter:description" content="Access AI, academic, SEO, design, productivity, marketing, and business tools from one secure Gen Z Digital Store dashboard." />
        <meta name="twitter:image" content="/logo-genz-digital-store.png" />

        <title>Gen Z Digital Store | All-in-One AI &amp; Digital Tools Hub</title>

        <!-- Favicon / app icons -->
        <link rel="icon" href="/logo-genz-digital-store.png" type="image/png" />
        <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
        <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

        <!-- Open the API connection while the app bundle downloads. Every request carries
             cookies (axios withCredentials), so this must NOT have `crossorigin` — that would
             warm the anonymous connection pool, which credentialed requests never use. -->
        <link rel="preconnect" href="https://api.genzdigitalstore.com" />

        <!-- Google Fonts — ONE request, loaded without blocking first paint.
             Previously fonts came from two places (this file AND an @import at the top of
             index.css): Inter was downloaded twice in two variants, Space Grotesk (only a
             fallback) was fetched, and the @import chained HTML → CSS → font CSS → fonts
             serially before anything could render. Only what the UI uses is requested:
             Inter 400–900 (800/900 are used), Sora 600–800 (headings), JetBrains Mono 500–700.
             display=swap: text shows immediately in the fallback font, then swaps. -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..900&family=JetBrains+Mono:wght@500..700&family=Sora:wght@600..800&display=swap" />
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..900&family=JetBrains+Mono:wght@500..700&family=Sora:wght@600..800&display=swap" media="print" onload="this.media='all'" />
        <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..900&family=JetBrains+Mono:wght@500..700&family=Sora:wght@600..800&display=swap" /></noscript>

        <!-- Self-heal stale caches on old devices. This app uses NO service worker; if a
             device still has one registered from a past build (or stale Cache Storage),
             unregister it and clear caches so the freshest bundle is always fetched.
             Safe no-op when none exist. index.html itself is served no-cache (.htaccess),
             and JS/CSS are content-hashed, so this only cleans up legacy SW/cache. -->
        <script>
          (function () {
            try {
              if ('serviceWorker' in navigator && navigator.serviceWorker.getRegistrations) {
                navigator.serviceWorker.getRegistrations()
                  .then(function (regs) { regs.forEach(function (r) { r.unregister(); }); })
                  .catch(function () {});
              }
              if (window.caches && caches.keys) {
                caches.keys()
                  .then(function (keys) { keys.forEach(function (k) { caches.delete(k); }); })
                  .catch(function () {});
              }
            } catch (e) { /* never block app start */ }
          })();
        </script>

        <!-- TrustBox script -->
        <script
          type="text/javascript"
          src="//widget.trustpilot.com/bootstrap/v5/tp.widget.bootstrap.min.js"
          async>
        </script>
        <!-- End TrustBox script -->
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
    </body>
</html>
