<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Access expired — Gen Z Digital Store</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      /* Brand deep-navy console gradient (#061528 → #0a2440) */
      background: radial-gradient(1200px 600px at 50% -10%, #0a2440 0%, #061528 55%, #04101f 100%);
      color: #eaf1fb;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 440px;
      background: rgba(10, 24, 48, 0.92);
      border: 1px solid rgba(6, 182, 212, 0.28);   /* brand cyan */
      border-radius: 20px;
      padding: 38px 32px;
      box-shadow: 0 24px 60px rgba(2, 8, 23, 0.6);
      text-align: center;
    }
    .logo {
      width: 72px; height: 72px;
      margin: 0 auto 18px;
      display: block;
      border-radius: 50%;
      box-shadow: 0 8px 28px rgba(6, 182, 212, 0.28);
    }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 10px; color: #f3f8ff; letter-spacing: -0.01em; }
    .tool { color: #22d3ee; font-weight: 600; }   /* brand cyan accent */
    p { color: rgba(234, 241, 251, 0.72); font-size: 15px; line-height: 1.6; margin-bottom: 26px; }
    .btn {
      display: inline-block;
      text-decoration: none;
      /* Brand CTA: royal blue → cyan */
      background: linear-gradient(135deg, #2563EB 0%, #06B6D4 100%);
      color: #ffffff;
      font-weight: 700;
      font-size: 15px;
      padding: 13px 28px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(37, 99, 235, 0.28);
      transition: transform .12s ease, box-shadow .12s ease;
    }
    .btn:hover { transform: translateY(-1px); box-shadow: 0 10px 30px rgba(6, 182, 212, 0.4); }
    .foot { margin-top: 22px; font-size: 12px; color: rgba(234, 241, 251, 0.42); }
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" id="badge" src="icons/icon128.png" alt="Gen Z Digital Store" />
    <h1 id="title">Your access has expired</h1>
    <p id="message">Your access to <span class="tool" id="tool-name">this tool</span> has expired or been removed. Please renew your plan to continue.</p>
    <a class="btn" id="renew" href="https://wa.me/923027467462" target="_blank" rel="noopener noreferrer">Renew your plan</a>
    <div class="foot" id="renew-fallback" style="margin-top:12px;display:none;">
      If WhatsApp does not open, message us at <strong>+92 302 7467462</strong>.
    </div>
    <div class="foot">Gen Z Digital Store · Secure access</div>
  </main>
  <script src="js/expired.js"></script>
</body>
</html>
