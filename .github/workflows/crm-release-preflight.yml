# CRM release PREFLIGHT — read-only, plus the two backups a release must be able to come back to.
#
# WHY THIS EXISTS. Releasing the CRM catalogue work means merging to `main`, which triggers
# Hostinger's own whole-tree rebuild of the backend. That rebuild has wiped live code before
# (2026-10-03, ~53 minutes of humanize downtime) because something was hand-deployed and never
# committed. So three facts must exist BEFORE the merge, and none of them can be obtained from
# outside the host:
#
#   1. WHICH DIRECTORY the running application is actually executing from.
#   2. A COMPLETE inventory of that directory, so live-vs-release can be diffed properly instead of
#      inferred from /health or from a handful of files somebody thought to look at.
#   3. RECOVERABLE references: an archive of the serving tree and a database dump, both outside
#      every public web root and readable only by the account that made them.
#
# WHAT THIS IS NOT. It deploys nothing, restarts nothing and writes no application file. Its only
# writes are the two backups, into ~/crm-release-backups/ (mode 0700, not under any public_html).
# It prints paths, sizes and digests — never a credential, never a row of customer data.
#
# THE SERVING-ROOT RESOLVER IS NOT NEW. It is the one reviewed on the WriteHuman diagnostics branch
# (`fix/agent-relogin-halt-resolution`), reused here verbatim in behaviour: read /proc/<pid>/cwd of
# the account's own node processes and pick the one that actually contains server-crm.js. The
# version still on `main` hardcodes `~/domains/api.genzdigitalstore.com/nodejs`, which is a STALE
# COPY nothing serves, and an earlier attempt that used `find | head -1` resolved to
# `wh-rollback-20260829-212153` — a rollback snapshot — and every conclusion drawn from it was
# wrong. The process table is the only authority. None of the paused Agent changes are merged,
# deployed or referenced by this workflow.
#
# AUTHENTICATION. Same contract as the reviewed deploy-frontend.yml on the release frontend branch:
# an SSH key from the `production` environment, and a host key PINNED from a known_hosts secret
# taken through a trusted channel (Hostinger hPanel). `ssh-keyscan` is deliberately not used —
# scanning a host and then trusting what it answers authenticates nothing. StrictHostKeyChecking is
# never relaxed. If either secret is absent the job stops with an actionable error and touches
# nothing.
name: CRM release preflight (read-only + backups)

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: 'The commit/ref being released, compared against what the server is running (default: this ref)'
        required: false
        default: ''
      skip_backups:
        description: 'true = inventory only, create no archive or dump (use only when a backup already exists)'
        required: false
        default: 'false'

permissions:
  contents: read

concurrency:
  group: crm-release-preflight
  cancel-in-progress: false

env:
  SFTP_HOST: '147.79.103.253'
  SFTP_PORT: '65002'
  SFTP_USER: 'u171982351'
  # Where backups go. Deliberately NOT under domains/*/public_html — a dump of the CRM schema
  # contains client names, invoices and balances and must never become web-reachable.
  BACKUP_DIR: 'crm-release-backups'

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install deploy key and PINNED host key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.HOSTINGER_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_PRIVATE_KEY:-}" ]; then
            echo "::error::Secret HOSTINGER_SSH_PRIVATE_KEY is not set in the 'production' environment. Preflight stopped before any connection."
            exit 1
          fi
          if [ -z "${SSH_KNOWN_HOSTS:-}" ]; then
            echo "::error::Secret HOSTINGER_SSH_KNOWN_HOSTS is not set. It must contain the server's host key as a known_hosts line for [${SFTP_HOST}]:${SFTP_PORT}, taken from Hostinger hPanel (a trusted channel) — not from ssh-keyscan. Host-key checking is not disabled to work around this."
            exit 1
          fi
          D="$RUNNER_TEMP/preflight-ssh"
          mkdir -p "$D" && chmod 700 "$D"
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$D/id_deploy"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$D/known_hosts"
          chmod 600 "$D/id_deploy" "$D/known_hosts"
          if ! grep -q 'PRIVATE KEY' "$D/id_deploy"; then
            echo "::error::HOSTINGER_SSH_PRIVATE_KEY does not look like a private key file (no PRIVATE KEY header). Check the secret was stored whole, including its header and footer lines."
            exit 1
          fi
          ssh-keygen -l -f "$D/id_deploy" >/dev/null 2>&1 \
            || echo "::warning::Could not read the key's fingerprint without a passphrase — expected for an encrypted key; continuing."
          if ! ssh-keygen -F "[${SFTP_HOST}]:${SFTP_PORT}" -f "$D/known_hosts" >/dev/null 2>&1; then
            echo "::error::HOSTINGER_SSH_KNOWN_HOSTS has no entry for [${SFTP_HOST}]:${SFTP_PORT}. Generate it with the hPanel-published fingerprint, in the bracketed host:port form."
            exit 1
          fi
          echo "SSH_DIR=$D" >> "$GITHUB_ENV"
          echo "Deploy key installed; host key PINNED for [${SFTP_HOST}]:${SFTP_PORT}."
          ssh-keygen -l -f "$D/known_hosts" | sed 's/^/  pinned: /'

      - name: Unlock the deploy key if it is encrypted
        env:
          SSH_PASSPHRASE: ${{ secrets.HOSTINGER_SSH_PASSPHRASE }}
        run: |
          set -euo pipefail
          # Guarded here rather than in a step `if:` — the secrets context is not dependably
          # available in step conditions, and an unset passphrase simply means an unencrypted key.
          if [ -z "${SSH_PASSPHRASE:-}" ]; then
            echo "No HOSTINGER_SSH_PASSPHRASE set — treating the key as unencrypted."
            exit 0
          fi
          eval "$(ssh-agent -s)" >/dev/null
          ASK="$SSH_DIR/askpass.sh"
          umask 077
          { echo '#!/bin/sh'; echo 'printf "%s\n" "$SSH_PASSPHRASE"'; } > "$ASK"
          chmod 700 "$ASK"
          SSH_ASKPASS="$ASK" SSH_ASKPASS_REQUIRE=force DISPLAY=:0 ssh-add "$SSH_DIR/id_deploy" >/dev/null 2>&1 \
            || { echo "::error::ssh-add rejected the key (wrong passphrase, or the secret is not a usable key)."; exit 1; }
          rm -f "$ASK"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          echo "Key unlocked into a job-scoped agent."

      - name: Prove authentication before anything else
        run: |
          set -uo pipefail
          O="-i $SSH_DIR/id_deploy -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$SSH_DIR/known_hosts -o BatchMode=yes -o ConnectTimeout=20 -p $SFTP_PORT"
          # shellcheck disable=SC2086
          if ! ssh $O "$SFTP_USER@$SFTP_HOST" 'echo AUTH_OK; id -un; hostname'; then
            echo "::error::SSH authentication to ${SFTP_USER}@${SFTP_HOST}:${SFTP_PORT} failed. The public half of HOSTINGER_SSH_PRIVATE_KEY must be present in that account's ~/.ssh/authorized_keys (hPanel → Advanced → SSH access). Nothing was read or written."
            exit 1
          fi

      - name: Resolve the SERVING ROOT from the running process
        run: |
          set -uo pipefail
          O="-i $SSH_DIR/id_deploy -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$SSH_DIR/known_hosts -o BatchMode=yes -o ConnectTimeout=20 -p $SFTP_PORT"
          # shellcheck disable=SC2086
          ssh $O "$SFTP_USER@$SFTP_HOST" 'bash -s' > root.txt 2>root.err <<'REMOTE'
          set -u
          say() { printf '\n===== %s =====\n' "$1"; }

          say "node processes owned by this account"
          for p in $(pgrep -u "$(whoami)" node 2>/dev/null | head -12); do
            printf 'pid %s cwd=%s args=%s\n' "$p" "$(readlink -f /proc/$p/cwd 2>/dev/null || echo '?')" \
              "$(tr '\0' ' ' < /proc/$p/cmdline 2>/dev/null | cut -c1-120)"
          done
          echo "node pids: $(pgrep -u "$(whoami)" -c node 2>/dev/null || echo 0)"

          say "serving root, resolved from /proc and never from a snapshot"
          # The reviewed resolver: the running process's own cwd, accepted only if it really is the
          # application (server-crm.js present). A name match on a path is not evidence.
          CW=""
          for p in $(pgrep -u "$(whoami)" node 2>/dev/null); do
            c="$(readlink -f /proc/$p/cwd 2>/dev/null)"
            if [ -n "$c" ] && [ -f "$c/server-crm.js" ]; then CW="$c"; break; fi
          done
          if [ -n "$CW" ]; then
            echo "SERVING_ROOT=$CW"
            echo "SERVING_ROOT_SOURCE=live /proc/<pid>/cwd"
          else
            echo "SERVING_ROOT=UNRESOLVED"
            echo "SERVING_ROOT_SOURCE=no node process of this account has server-crm.js in its cwd"
            echo "candidates (for the operator, NOT used as an answer):"
            find "$HOME/domains" -maxdepth 6 -name server-crm.js -printf '  %p\t%TY-%Tm-%Td\n' 2>/dev/null | head -10
          fi

          say "what Passenger is configured to serve"
          for h in "$HOME/domains/api.genzdigitalstore.com/public_html/.htaccess"; do
            [ -f "$h" ] && { echo "--- $h"; grep -iE 'Passenger(AppRoot|Enabled|StartupFile|AppType)|SetEnv' "$h" | sed 's/\(SetEnv[[:space:]]\+[A-Za-z0-9_]*\).*/\1 <value not printed>/' | head -20; }
          done
          REMOTE
          RC=$?
          echo "ssh exit=$RC"
          [ -s root.err ] && { echo "--- stderr ---"; cat root.err; }
          cat root.txt
          SR="$(grep -m1 '^SERVING_ROOT=' root.txt | cut -d= -f2-)"
          if [ -z "$SR" ] || [ "$SR" = "UNRESOLVED" ]; then
            echo "::error::The serving root could not be resolved from the process table. Preflight stops here: every later comparison and backup would describe a directory nobody is serving."
            exit 1
          fi
          echo "SERVING_ROOT=$SR" >> "$GITHUB_ENV"
          echo "::notice title=serving-root::$SR"

      - name: COMPLETE inventory of the serving tree
        env:
          # Via env, never `${{ }}` interpolated into the script body: a workflow_dispatch input
          # spliced into a run block is a shell-injection vector, and deployWorkflowSecurity's guard
          # exists because of exactly that mistake.
          RELEASE_REF_INPUT: ${{ github.event.inputs.release_ref }}
        run: |
          set -uo pipefail
          O="-i $SSH_DIR/id_deploy -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$SSH_DIR/known_hosts -o BatchMode=yes -o ConnectTimeout=20 -p $SFTP_PORT"
          # Every tracked-kind file under the serving root, hashed. Not a selected list: the point
          # is to find live-only files, which by definition nobody thought to look for.
          # shellcheck disable=SC2086
          ssh $O "$SFTP_USER@$SFTP_HOST" "cd '$SERVING_ROOT' && find . \
              \( -name node_modules -o -name .git -o -name .builds -o -name logs \) -prune -o \
              -type f \( -name '*.js' -o -name '*.mjs' -o -name '*.cjs' -o -name '*.json' -o -name '*.sql' \) -print0 \
            | xargs -0 sha256sum 2>/dev/null | sort -k2" > live-manifest.txt
          echo "live files hashed: $(wc -l < live-manifest.txt)"
          head -5 live-manifest.txt

          # The same manifest for the release commit, computed locally over the same file kinds.
          REL="${RELEASE_REF_INPUT:-}"
          [ -z "$REL" ] && REL="$GITHUB_SHA"
          git rev-parse --verify "$REL" >/dev/null 2>&1 || { echo "::error::release_ref '$REL' is not a commit in this repository."; exit 1; }
          echo "RELEASE_REF_RESOLVED=$(git rev-parse "$REL")" >> "$GITHUB_ENV"
          rm -rf rel && git worktree add -q --detach rel "$REL"
          ( cd rel/backend && find . \
              \( -name node_modules -o -name .git \) -prune -o \
              -type f \( -name '*.js' -o -name '*.mjs' -o -name '*.cjs' -o -name '*.json' -o -name '*.sql' \) -print0 \
            | xargs -0 sha256sum 2>/dev/null | sort -k2 ) > release-manifest.txt
          echo "release files hashed: $(wc -l < release-manifest.txt)"

          # Three answers, each one a release decision. `sha256sum` writes 64 hex characters, two
          # spaces, then the path — so the path begins at column 67. Each manifest is reduced to
          # path<TAB>hash first: joining on a field number breaks on any path containing a space,
          # and a column offset counted by hand is exactly the kind of detail that silently reports
          # "no differences".
          TAB="$(printf '\t')"
          kv() { awk '{ print substr($0, 67) "\t" substr($0, 1, 64) }' "$1" | LC_ALL=C sort -t "$TAB" -k1,1; }
          kv live-manifest.txt > live.kv
          kv release-manifest.txt > release.kv
          join -t "$TAB" live.kv release.kv | awk -F "$TAB" '$2 != $3 { print $1 }' > differs.txt || true
          comm -23 <(cut -f1 live.kv) <(cut -f1 release.kv) > live-only.txt || true
          comm -13 <(cut -f1 live.kv) <(cut -f1 release.kv) > release-only.txt || true
          {
            echo "## CRM release preflight"
            echo
            echo "- serving root: \`$SERVING_ROOT\` (resolved from /proc)"
            echo "- release ref: \`$(git rev-parse "$REL")\`"
            echo "- live files: $(wc -l < live-manifest.txt), release files: $(wc -l < release-manifest.txt)"
            echo "- content differs: **$(wc -l < differs.txt)**, live-only: **$(wc -l < live-only.txt)**, release-only: **$(wc -l < release-only.txt)**"
            echo
            echo '### LIVE-ONLY files — these are what a whole-tree rebuild would DESTROY'
            echo '```'; cat live-only.txt; echo '```'
            echo '### Content differs'
            echo '```'; head -200 differs.txt; echo '```'
            echo '### Present in the release, absent live (expected for new modules)'
            echo '```'; head -200 release-only.txt; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=inventory::differs=$(wc -l < differs.txt) live-only=$(wc -l < live-only.txt) release-only=$(wc -l < release-only.txt)"
          if [ -s live-only.txt ]; then
            echo "::warning::The serving tree holds files that are not in the release. A main-triggered rebuild would remove them. Review the LIVE-ONLY list before merging."
          fi

      - name: Schema version actually applied (read-only SELECT)
        run: |
          set -uo pipefail
          O="-i $SSH_DIR/id_deploy -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$SSH_DIR/known_hosts -o BatchMode=yes -o ConnectTimeout=20 -p $SFTP_PORT"
          # Reads the application's own configuration on the server to connect. Nothing from that
          # file is printed: only the migration versions and table names come back.
          # shellcheck disable=SC2086
          ssh $O "$SFTP_USER@$SFTP_HOST" "SERVING_ROOT='$SERVING_ROOT' bash -s" > schema.txt 2>schema.err <<'REMOTE'
          set -u
          cd "$SERVING_ROOT" || exit 1
          node -e '
            const fs = require("fs"), path = require("path");
            // The same resolution order the app uses; values are never echoed.
            for (const p of ["config/.env", ".env", "../config/.env"]) {
              const f = path.resolve(p);
              if (fs.existsSync(f)) {
                for (const line of fs.readFileSync(f, "utf8").split(/\r?\n/)) {
                  const m = /^\s*([A-Za-z0-9_]+)\s*=\s*(.*)$/.exec(line);
                  if (m && !process.env[m[1]]) process.env[m[1]] = m[2].replace(/^["\x27]|["\x27]$/g, "");
                }
              }
            }
            const mysql = require("mysql2/promise");
            (async () => {
              const c = await mysql.createConnection(process.env.DATABASE_URL);
              const [db] = await c.query("SELECT DATABASE() d, VERSION() v");
              console.log("database=" + db[0].d + " engine=" + db[0].v);
              try {
                const [m] = await c.query("SELECT version, applied_at FROM biz_crm_schema_migrations ORDER BY version");
                console.log("migrations=" + m.map((r) => r.version).join(","));
              } catch (e) { console.log("migrations=UNREADABLE (" + e.code + ")"); }
              const [t] = await c.query("SHOW TABLES LIKE \x27biz_crm_product_sources\x27");
              console.log("biz_crm_product_sources_exists=" + (t.length ? "yes" : "no"));
              if (t.length) {
                const [n] = await c.query("SELECT COUNT(*) n FROM biz_crm_product_sources");
                console.log("biz_crm_product_sources_rows=" + n[0].n);
              }
              const [p] = await c.query("SELECT COUNT(*) n FROM biz_crm_products WHERE deleted_at IS NULL");
              console.log("products_live=" + p[0].n);
              await c.end();
            })().catch((e) => { console.log("schema_probe_failed=" + (e.code || e.message)); process.exit(0); });
          '
          REMOTE
          echo "ssh exit=$?"
          [ -s schema.err ] && { echo "--- stderr ---"; cat schema.err; }
          cat schema.txt
          { echo '### Schema actually applied'; echo '```'; cat schema.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=schema::$(tr '\n' ' ' < schema.txt | cut -c1-400)"

      - name: Create the recovery references (code archive + database dump)
        if: ${{ github.event.inputs.skip_backups != 'true' }}
        run: |
          set -uo pipefail
          O="-i $SSH_DIR/id_deploy -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$SSH_DIR/known_hosts -o BatchMode=yes -o ConnectTimeout=20 -p $SFTP_PORT"
          # Both land in ~/crm-release-backups, mode 0700, OUTSIDE every public_html. The dump holds
          # client names, invoices and balances, so its permissions are the point, not an extra.
          # shellcheck disable=SC2086
          ssh $O "$SFTP_USER@$SFTP_HOST" "SERVING_ROOT='$SERVING_ROOT' BACKUP_DIR='$BACKUP_DIR' bash -s" > backup.txt 2>backup.err <<'REMOTE'
          set -u
          STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
          B="$HOME/$BACKUP_DIR"
          mkdir -p "$B" && chmod 700 "$B"
          case "$B" in *public_html*) echo "REFUSING: backup directory is inside a web root"; exit 1;; esac

          CODE="$B/backend-$STAMP.tar.gz"
          tar -czf "$CODE" -C "$(dirname "$SERVING_ROOT")" \
            --exclude=node_modules --exclude=.git --exclude=logs "$(basename "$SERVING_ROOT")" 2>/dev/null
          chmod 600 "$CODE"
          echo "CODE_BACKUP=$CODE"
          echo "CODE_BYTES=$(stat -c %s "$CODE")"
          echo "CODE_SHA256=$(sha256sum "$CODE" | cut -d' ' -f1)"

          cd "$SERVING_ROOT" || exit 1
          DUMP="$B/db-$STAMP.sql.gz"
          node -e '
            const fs = require("fs"), path = require("path");
            for (const p of ["config/.env", ".env", "../config/.env"]) {
              const f = path.resolve(p);
              if (fs.existsSync(f)) for (const line of fs.readFileSync(f, "utf8").split(/\r?\n/)) {
                const m = /^\s*([A-Za-z0-9_]+)\s*=\s*(.*)$/.exec(line);
                if (m && !process.env[m[1]]) process.env[m[1]] = m[2].replace(/^["\x27]|["\x27]$/g, "");
              }
            }
            const u = new URL(process.env.DATABASE_URL);
            // Written to a 0600 file, not printed and not passed on a command line where `ps`
            // would show it.
            fs.writeFileSync(process.env.HOME + "/.my.cnf.preflight",
              "[client]\nhost=" + u.hostname + "\nport=" + (u.port || 3306) +
              "\nuser=" + decodeURIComponent(u.username) +
              "\npassword=\"" + decodeURIComponent(u.password) + "\"\n", { mode: 0o600 });
            console.log(decodeURIComponent(u.pathname).replace(/^\//, ""));
          ' > /tmp/dbname.$$ 2>/dev/null
          DBN="$(cat /tmp/dbname.$$ 2>/dev/null)"; rm -f /tmp/dbname.$$
          if [ -z "$DBN" ]; then
            echo "DB_BACKUP=FAILED (could not read the application's database configuration)"
          else
            CLI="mariadb-dump"; command -v "$CLI" >/dev/null 2>&1 || CLI="mysqldump"
            if "$CLI" --defaults-extra-file="$HOME/.my.cnf.preflight" --single-transaction --quick \
                 --routines --events --default-character-set=utf8mb4 "$DBN" 2>/tmp/dumperr.$$ | gzip -9 > "$DUMP"; then
              chmod 600 "$DUMP"
              echo "DB_BACKUP=$DUMP"
              echo "DB_BYTES=$(stat -c %s "$DUMP")"
              echo "DB_SHA256=$(sha256sum "$DUMP" | cut -d' ' -f1)"
            else
              echo "DB_BACKUP=FAILED"; head -3 /tmp/dumperr.$$ 2>/dev/null
            fi
            rm -f /tmp/dumperr.$$
          fi
          rm -f "$HOME/.my.cnf.preflight"
          echo "--- backup directory ---"
          ls -la "$B" | tail -10
          echo "mode: $(stat -c %a "$B")"
          REMOTE
          echo "ssh exit=$?"
          [ -s backup.err ] && { echo "--- stderr ---"; cat backup.err; }
          cat backup.txt
          { echo '### Recovery references'; echo '```'; cat backup.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=backups::$(grep -E '^(CODE_BACKUP|CODE_SHA256|DB_BACKUP|DB_SHA256)=' backup.txt | tr '\n' ' ' | cut -c1-400)"
          if ! grep -q '^CODE_BACKUP=/' backup.txt || ! grep -q '^DB_BACKUP=/' backup.txt; then
            echo "::error::One of the two recovery references was not created. Do not proceed to a schema-changing release without both."
            exit 1
          fi

      - name: Keep the manifests as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crm-release-preflight
          path: |
            live-manifest.txt
            release-manifest.txt
            differs.txt
            live-only.txt
            release-only.txt
            root.txt
            schema.txt
            backup.txt
          if-no-files-found: warn
          retention-days: 30
