# READ-ONLY Hostinger diagnostics. Measures the actual hosting account so resource claims can be
# evidence-based instead of asserted.
#
# WHAT THIS IS NOT: it writes nothing, restarts nothing, deletes nothing and installs nothing. Every
# command is a read. It is manual-dispatch only — never on push — and bounded by a job timeout and
# per-command timeouts so a slow host cannot hold the runner.
#
# It runs against the HOSTINGER ACCOUNT over the same pinned-host-key SSH used by the deploy, not
# against the GitHub runner (runner CPU/RAM says nothing about the shared host).
#
# SECRETS: never printed. The key goes to RUNNER_TEMP at 0600; host-key checking is strict and
# pinned, exactly as in deploy-frontend.yml. No .env, connection string, private log or customer
# data is read or echoed — the MySQL section uses SHOW STATUS only, via the credentials already on
# the host, and prints counters, never values.
name: Hostinger diagnostics (read-only)

on:
  workflow_dispatch:
    inputs:
      note:
        description: 'Why this sample was taken (recorded in the summary)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: hostinger-diagnostics
  cancel-in-progress: false

env:
  SFTP_HOST: '147.79.103.253'
  SFTP_PORT: '65002'
  SFTP_USER: 'u171982351'
  API_ROOT: '/home/u171982351/domains/api.genzdigitalstore.com/nodejs'
  MAIN_WEB: '/home/u171982351/domains/genzdigitalstore.com/public_html'
  APP_WEB: '/home/u171982351/domains/app.genzdigitalstore.com/public_html'

jobs:
  measure:
    name: Measure the hosting account
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Install deploy key and PINNED host key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.HOSTINGER_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_PRIVATE_KEY:-}" ] || [ -z "${SSH_KNOWN_HOSTS:-}" ]; then
            echo "::error::HOSTINGER_SSH_PRIVATE_KEY and HOSTINGER_SSH_KNOWN_HOSTS must both be set in the 'production' environment."
            exit 1
          fi
          D="$RUNNER_TEMP/diag-ssh"
          mkdir -p "$D" && chmod 700 "$D"
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$D/id_deploy"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$D/known_hosts"
          chmod 600 "$D/id_deploy" "$D/known_hosts"
          ssh-keygen -F "[${SFTP_HOST}]:${SFTP_PORT}" -f "$D/known_hosts" >/dev/null \
            || { echo "::error::the pinned host key does not cover [${SFTP_HOST}]:${SFTP_PORT}"; exit 1; }
          echo "SSH_DIR=$D" >> "$GITHUB_ENV"

      - name: Unlock the key if encrypted
        env:
          SSH_PASSPHRASE: ${{ secrets.HOSTINGER_SSH_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_PASSPHRASE:-}" ]; then echo "key treated as unencrypted"; exit 0; fi
          eval "$(ssh-agent -s)" >/dev/null
          ASK="$SSH_DIR/askpass.sh"; umask 077
          printf '#!/usr/bin/env bash\nprintf "%%s\\n" "$SSH_PASSPHRASE"\n' > "$ASK"; chmod 700 "$ASK"
          SSH_ASKPASS="$ASK" SSH_ASKPASS_REQUIRE=force DISPLAY=:0 ssh-add "$SSH_DIR/id_deploy" >/dev/null 2>&1 \
            || { echo "::error::ssh-add rejected the key"; exit 1; }
          rm -f "$ASK"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"

      # TARGETED, READ-ONLY: the two questions this release actually turns on. Writes nothing,
      # reads no .env value (only whether a key is present), hashes the published installer once so
      # the reported SHA-256 is measured rather than assumed.
      - name: INCIDENT-5 refresh-token contention and deployment dates
        run: |
          set -uo pipefail
          O="-i $SSH_DIR/id_deploy -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$SSH_DIR/known_hosts -o BatchMode=yes -o ConnectTimeout=20 -p $SFTP_PORT"
          # shellcheck disable=SC2086
          ssh $O "$SFTP_USER@$SFTP_HOST" 'bash -s' > inc5.txt 2>inc5.err <<'REMOTE'
          set -u
          run() { timeout 150 bash -c "$1" 2>&1 | head -50 || echo "(unavailable)"; }
          export DOM="$HOME/domains/api.genzdigitalstore.com"
          export APILOG="$(readlink -f "$DOM/hbuilds/current")/nodejs/console.log"
          export GWLOG="$HOME/writehuman-gateway/console.log"

          echo "=== 1. EVERY DEPLOYMENT, BY DATE ==="
          run 'ls -1 "$DOM/hbuilds/logs"/*/*.log 2>/dev/null | sed "s|.*/||" | sort | tr "\n" " "; echo'
          run 'f="$(ls -1t "$DOM/hbuilds/logs"/*/*.log 2>/dev/null | head -1)"; echo "NEWEST DEPLOY LOG: $f"; [ -f "$f" ] && head -30 "$f" | sed -r "s/\x1b\[[0-9;]*m//g" | cut -c1-140 | sed "s/^/  /"'

          echo "=== 2. SUPABASE REFRESH-TOKEN CONTENTION (counts + last time only) ==="
          # The decisive signature of two browsers rotating one refresh token: Supabase answers the
          # loser with "Already Used" / invalid_grant. Counts and timestamps only; never a line.
          run 'for f in "$GWLOG" "$APILOG"; do [ -f "$f" ] || continue; printf "%s (%sB, %s):" "$f" "$(stat -c %s "$f")" "$(stat -c %y "$f" | cut -c1-16)"; for k in "already_used" "Already Used" "invalid_grant" "refresh_token_not_found" "Invalid Refresh Token" "grant_type=refresh_token" "token_refresh" "AuthApiError"; do printf " [%s]=%s" "$k" "$(grep -c -iF "$k" "$f" 2>/dev/null || echo 0)"; done; echo; done'
          run 'for f in "$GWLOG" "$APILOG"; do [ -f "$f" ] || continue; printf "%s candidate/verify codes:" "$(basename "$(dirname "$f")")/$(basename "$f")"; for k in SESSION_EXPIRED VERIFICATION_INCONCLUSIVE ACCOUNT_MISMATCH PROMOTED readonly_no_exchange "canary" "proxyVerify" "session_expired" "wrong_account"; do printf " [%s]=%s" "$k" "$(grep -c -F "$k" "$f" 2>/dev/null || echo 0)"; done; echo; done'
          # WHEN did the last of each happen? Only the matched timestamp token is printed.
          run 'f="$APILOG"; [ -f "$f" ] && for k in SESSION_EXPIRED VERIFICATION_INCONCLUSIVE readonly_no_exchange; do l="$(grep -F "$k" "$f" | tail -1)"; printf "%-28s last-at=%s\n" "$k" "$(printf "%s" "$l" | grep -oE "[0-9]{4}-[0-9]{2}-[0-9]{2}[T ][0-9]{2}:[0-9]{2}:[0-9]{2}" | tail -1)"; done'
          run 'f="$GWLOG"; [ -f "$f" ] && { printf "gateway log tail shape: "; tail -c 2000 "$f" | grep -oE "\[[a-z-]+\]|HTTP/1\.[01]\" [0-9]{3}|status[=: ]*[0-9]{3}|lease[a-z_]*" | sort | uniq -c | sort -rn | head -10 | tr "\n" " "; echo; }'

          echo "=== 3. IS THE SUPABASE SESSION INJECTED INTO CLIENT BROWSERS? ==="
          run 'd="$HOME/writehuman-gateway"; printf "SUPABASE_BROWSER_SESSION in .env: %s\n" "$(grep -c "^SUPABASE_BROWSER_SESSION=" "$d/.env" 2>/dev/null || echo 0)"; printf "value: %s\n" "$(grep -m1 "^SUPABASE_BROWSER_SESSION=" "$d/.env" 2>/dev/null | cut -d= -f2-)"'
          run 'd="$HOME/writehuman-gateway"; printf "injectSupabaseBrowserSession=%s  sessionCache=%s  LEASE=%s\n" "$(grep -c injectSupabaseBrowserSession "$d/server.js")" "$(grep -c "SESSION_CACHE_MS\|sessionCache" "$d/server.js")" "$(grep -c "revokedReason" "$d/server.js")"'
          run 'curl -s --max-time 20 https://writehuman1.genzdigitalstore.com/__genz/health | head -c 500; echo'
          REMOTE
          RC=$?; echo "ssh exit=$RC"
          if [ ! -s inc5.txt ]; then echo "::error::no output"; head -5 inc5.err || true; exit 1; fi
          if grep -qiE 'BEGIN [A-Z ]*PRIVATE KEY|mysql://|DATABASE_URL=|JWT_SECRET=|eyJ[A-Za-z0-9_-]{20,}|sb-[a-z0-9]{10,}-auth-token=' inc5.txt; then
            echo "::error::captured output matched a secret-shaped pattern; not publishing it"; exit 1; fi
          { echo "## INCIDENT-5: rotation contention + deployment dates"; echo ''; echo '```'; cat inc5.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          cat inc5.txt
          emit() { printf '::notice title=%s::%s\n' "$1" "$2"; }
          emit "deploy-dates" "$(sed -n '/1. EVERY DEPLOYMENT/,/NEWEST DEPLOY LOG/p' inc5.txt | grep -E '_deploy\.log' | tr '\n' ' ' | cut -c1-420)"
          emit "deploy-head"  "$(sed -n '/NEWEST DEPLOY LOG/,/2. SUPABASE/p' inc5.txt | grep -vE '^$' | head -12 | tr '\n' '|' | cut -c1-420)"
          emit "rotation"     "$(grep -E '\[already_used\]|\[Already Used\]' inc5.txt | tr '\n' '|' | cut -c1-420)"
          emit "verify-codes" "$(grep -E 'candidate/verify codes:' inc5.txt | tr '\n' '|' | cut -c1-420)"
          emit "last-at"      "$(grep -E 'last-at=' inc5.txt | tr '\n' '|' | cut -c1-420)"
          emit "gw-shape"     "$(grep -m1 'gateway log tail shape:' inc5.txt | cut -c1-420)"
          emit "browser-sess" "$(sed -n '/3. IS THE SUPABASE SESSION/,$p' inc5.txt | grep -E 'SUPABASE_BROWSER_SESSION|value:|injectSupabase' | tr '\n' '|' | cut -c1-420)"
          emit "gw-health"    "$(grep -m1 -E '^\{"ok"' inc5.txt | cut -c1-420)"

