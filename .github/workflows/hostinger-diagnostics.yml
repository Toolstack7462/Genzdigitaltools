# AUTHORIZED PUBLISH of the verified WriteHuman agent installer.
#
# WHY THIS FILE AND NOT A NEW ONE. `workflow_dispatch` only offers a workflow that exists on the
# DEFAULT branch, but the version at the dispatched REF is what runs. This repository's one
# dispatchable Hostinger-credentialed workflow is hostinger-diagnostics.yml, so on THIS branch that
# file carries the publish job instead of the read-only probes. The Actions list will still show the
# name the default branch gives it; the job name and this header are the honest record of what ran.
# Nothing is promoted unless `confirm` is exactly PUBLISH.
#
# WHY THE INSTALLER IS COMMITTED ON THIS BRANCH. The runner cannot otherwise obtain the bytes:
# writehuman-v2/agent/dist/ is gitignored, the file is 91,807,232 bytes, and the container that
# holds it has no network route to the Hostinger host. This branch exists to carry those bytes to
# the runner once, and may be deleted afterwards.
#
# ORDER OF OPERATIONS, and why it is this order:
#   1. verify the committed artifact against writehuman-v2/release/agent-3.5.15.json BEFORE touching
#      anything — version, byte count and SHA-256 must all match or the job stops;
#   2. copy the live latest.json + exe into a timestamped backup directory and verify the backup
#      hashes to the same value as the file it copied, because a backup nobody checked is not a
#      rollback;
#   3. upload to a STAGING filename and hash it ON THE HOST — a truncated transfer must not be able
#      to become the published file;
#   4. promote the exe, then write latest.json LAST. Metadata is never allowed to advertise bytes
#      that are not there; the reverse order would publish a hash mismatch;
#   5. verify through the PUBLIC route: the metadata fields, then ONE FULL STREAMED DOWNLOAD whose
#      bytes are hashed, then the CORS answer for both member domains;
#   6. on any failure from step 4 onward, restore both files from the backup and verify the restore.
#
# SECRETS: never printed. The key goes to RUNNER_TEMP at 0600; host-key checking is strict and
# pinned and is never disabled to work around a missing entry. No .env value is read. The agent's
# cookies, sessions and accounts are untouched: this job writes two files in ~/writehuman-agent and
# nothing else. It does not restart anything.
name: Hostinger — authorized agent installer publish

on:
  workflow_dispatch:
    inputs:
      note:
        description: 'Why this publish is being run (recorded in the summary)'
        required: false
        default: ''
      confirm:
        description: 'PUBLISH = installer, GATEWAY = gateway, EXTENSION = extension package, EXTCHECK = read the live package. Anything else is a dry run.'
        required: true
        default: ''

permissions:
  contents: read

concurrency:
  group: hostinger-agent-publish
  cancel-in-progress: false

env:
  SFTP_HOST: '147.79.103.253'
  SFTP_PORT: '65002'
  SFTP_USER: 'u171982351'
  MANIFEST: 'writehuman-v2/release/agent-3.5.15.json'
  ARTIFACT: 'writehuman-v2/agent/dist/WriteHuman-Agent-Setup-x64.exe'

jobs:
  # ── READ-ONLY: what is the LIVE extension, and does it still carry the defect? ───────────────
  # The newer-live guard refused a release and reported why: both docroots serve v3.9.35, while
  # this repository's chrome-extension/ source is 3.9.31. Versions 3.9.32-3.9.35 were therefore
  # published from somewhere that is not this branch, so the repo tree is NOT the live code and
  # shipping it would overwrite four releases' worth of unknown changes.
  #
  # Before deciding anything, read the live package. The runner has open internet, so it fetches
  # the served ZIP itself — nothing is written and the host is not touched.
  # ── WHY IS THE CLIENT STILL SEEING WRITEHUMAN'S LOGIN PAGE (read-only) ───────────────────────
  # The extension crash is fixed and served (v3.9.37 executes on a cold wake), and the gateway
  # alignment fix is live, but the client still lands on WriteHuman's logged-out page. The two are
  # different failures: one stops the tool OPENING, this one is about which SESSION is delivered.
  #
  # So this reads the RUNNING code and the existing logs rather than re-deriving from the repo:
  # whether the promotion-proof gate is actually in the running API, what the gateway's own
  # alignment log says, and when the API was last deployed. It changes nothing, creates no refresh
  # exchange, touches no account, and prints identifiers, counts and timestamps only.
  whdiag:
    name: Why the client still gets the login page (read-only)
    if: ${{ inputs.confirm == 'WHDIAG' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deploy key and PINNED host key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.HOSTINGER_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_PRIVATE_KEY:-}" ] || [ -z "${SSH_KNOWN_HOSTS:-}" ]; then
            echo "::error::HOSTINGER_SSH_PRIVATE_KEY and HOSTINGER_SSH_KNOWN_HOSTS must both be set."; exit 1
          fi
          D="$RUNNER_TEMP/dg-ssh"; mkdir -p "$D" && chmod 700 "$D"; umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$D/id_deploy"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$D/known_hosts"
          chmod 600 "$D/id_deploy" "$D/known_hosts"
          grep -q 'PRIVATE KEY' "$D/id_deploy" || { echo "::error::the stored key has no PRIVATE KEY header"; exit 1; }
          ssh-keygen -F "[${SFTP_HOST}]:${SFTP_PORT}" -f "$D/known_hosts" >/dev/null 2>&1 \
            || { echo "::error::known_hosts has no entry for [${SFTP_HOST}]:${SFTP_PORT}"; exit 1; }
          echo "SSH_DIR=$D" >> "$GITHUB_ENV"

      - name: Unlock the key if encrypted
        env:
          SSH_PASSPHRASE: ${{ secrets.HOSTINGER_SSH_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_PASSPHRASE:-}" ]; then echo "key treated as unencrypted"; exit 0; fi
          eval "$(ssh-agent -s)" >/dev/null
          ASK="$SSH_DIR/askpass.sh"; umask 077
          printf '#!/usr/bin/env bash\nprintf "%%s\\n" "$SSH_PASSPHRASE"\n' > "$ASK"; chmod 700 "$ASK"
          SSH_ASKPASS="$ASK" SSH_ASKPASS_REQUIRE=force DISPLAY=:0 ssh-add "$SSH_DIR/id_deploy" >/dev/null 2>&1 \
            || { echo "::error::ssh-add rejected the key"; exit 1; }
          rm -f "$ASK"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"

      - name: Read the running code and the existing logs
        run: |
          set -uo pipefail
          O="-i $SSH_DIR/id_deploy -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$SSH_DIR/known_hosts -o BatchMode=yes -o ConnectTimeout=20 -p $SFTP_PORT"
          # shellcheck disable=SC2086
          ssh $O "$SFTP_USER@$SFTP_HOST" "bash -s" > diag.txt 2>diag.err <<'REMOTE'
          set -u
          echo "== HOST =="; date -u +%Y-%m-%dT%H:%M:%SZ

          # 1. The RUNNING API, resolved from the process, never from a guessed directory —
          #    `find | head -1` once resolved to a rollback snapshot and made everything look right.
          echo "== RUNNING API =="
          API=""
          for p in $(pgrep -f 'node' 2>/dev/null); do
            cwd=$(readlink -f "/proc/$p/cwd" 2>/dev/null) || continue
            [ -n "$cwd" ] || continue
            if [ -f "$cwd/server-crm.js" ] || [ -f "$cwd/backend/server-crm.js" ]; then
              [ -f "$cwd/server-crm.js" ] && API="$cwd" || API="$cwd/backend"
              echo "pid=$p cwd=$cwd"
              break
            fi
          done
          if [ -z "$API" ]; then
            echo "NO_RUNNING_NODE_API_FOUND (Passenger may spawn per-request)"
            C="$HOME/hbuilds/current"
            [ -L "$C" ] && echo "hbuilds/current -> $(readlink -f "$C")"
            for cand in "$(readlink -f "$C" 2>/dev/null)/nodejs/backend" "$(readlink -f "$C" 2>/dev/null)/nodejs"; do
              [ -f "$cand/utils/proxy/candidateSync.js" ] && { API="$cand"; echo "falling back to deployed tree: $cand"; break; }
            done
          fi
          echo "API_ROOT=${API:-none}"

          # 2. Is the promotion-proof gate actually in the running code?
          echo "== PROMOTION GATE IN RUNNING CODE =="
          if [ -n "${API:-}" ] && [ -f "$API/utils/proxy/candidateSync.js" ]; then
            f="$API/utils/proxy/candidateSync.js"
            echo "candidateSync.js bytes=$(stat -c %s "$f") mtime=$(date -u -r "$f" +%Y-%m-%dT%H:%M:%SZ)"
            echo "canary_mentions=$(grep -c 'canary' "$f" 2>/dev/null || echo 0)"
            echo "VERIFICATION_INCONCLUSIVE=$(grep -c 'VERIFICATION_INCONCLUSIVE' "$f" 2>/dev/null || echo 0)"
            echo "readOnly_verify=$(grep -c 'readOnly: true' "$f" 2>/dev/null || echo 0)"
            # Three distinct states, because "canaryExpected is present" stopped being the signal
            # once the gate was corrected to RECORD proof instead of refusing on its absence.
            # No `|| echo 0`: grep -c already prints 0 and merely EXITS 1 on no match, so the
            # fallback appended a second line and every numeric comparison below then compared
            # against "0\n0" and took the wrong branch. The remote script runs under `set -u`
            # alone, so a non-zero exit here is harmless.
            has_expected=$(grep -c 'canaryExpected' "$f" 2>/dev/null); has_expected=${has_expected:-0}
            refuses_unproven=$(grep -c "canary !== 'passed'" "$f" 2>/dev/null); refuses_unproven=${refuses_unproven:-0}
            records_proof=$(grep -c 'canaryProven' "$f" 2>/dev/null); records_proof=${records_proof:-0}
            echo "canaryExpected=$has_expected refuses_unproven=$refuses_unproven records_proof=$records_proof"
            if [ "$refuses_unproven" != "0" ]; then
              echo "GATE=REFUSES_UNPROVEN (the WriteHuman-only outage is live)"
            elif [ "$records_proof" != "0" ]; then
              echo "GATE=RECORDS_PROOF (corrected: promotes and labels, refuses only a proven negative)"
            elif [ "$has_expected" != "0" ]; then
              echo "GATE=UNRECOGNISED_SHAPE"
            else
              echo "GATE=ABSENT (no canary handling at all)"
            fi
          else
            echo "candidateSync.js NOT FOUND under ${API:-none}"
          fi

          # 3. EVERY gateway, not the first match. They all share the package name
          #    genz-proxy-gateway, so breaking on the first one reported ryne-gateway's code while
          #    the question was about writehuman-gateway's.
          echo "== RUNNING GATEWAYS (all) =="
          for p in $(pgrep -f 'node' 2>/dev/null); do
            cwd=$(readlink -f "/proc/$p/cwd" 2>/dev/null) || continue
            [ -f "$cwd/server.js" ] || continue
            echo "pid=$p name=$(basename "$cwd") sha256=$(sha256sum "$cwd/server.js" | cut -c1-16) align_fn=$(grep -c 'shouldAlignBrowserSession' "$cwd/server.js" 2>/dev/null || echo 0) align_log=$(grep -c 'supabase_session_align' "$cwd/server.js" 2>/dev/null || echo 0)"
          done
          echo "-- writehuman-gateway on disk --"
          W="$HOME/writehuman-gateway/server.js"
          if [ -f "$W" ]; then
            echo "sha256=$(sha256sum "$W" | cut -c1-16) bytes=$(stat -c %s "$W") mtime=$(date -u -r "$W" +%Y-%m-%dT%H:%M:%SZ)"
            echo "align_fn=$(grep -c 'shouldAlignBrowserSession' "$W") align_log=$(grep -c 'supabase_session_align' "$W")"
          else
            echo "ABSENT"
          fi
          echo "-- alignment log volume --"
          L="$HOME/writehuman-gateway/console.log"
          if [ -f "$L" ]; then
            echo "console.log bytes=$(stat -c %s "$L") mtime=$(date -u -r "$L" +%Y-%m-%dT%H:%M:%SZ) align_lines=$(grep -c supabase_session_align "$L")"
            echo "last 5 align reasons:"; grep supabase_session_align "$L" | tail -5
          fi

          # 3b. Is the session the gateway hands out actually a signed-in one? Metadata ONLY:
          #     column names first, then a projection chosen from them. No cookie or token value is
          #     read, and nothing is refreshed, rotated or written.
          echo "== VAULT SESSION METADATA =="
          if [ -n "${API:-}" ] && [ -f "$API/.env" ]; then
            cd "$API" 2>/dev/null && node -e '
              require("dotenv").config();
              const mysql = require("mysql2/promise");
              (async () => {
                let c;
                try {
                  c = await mysql.createConnection({
                    host: process.env.DB_HOST, user: process.env.DB_USER,
                    password: process.env.DB_PASSWORD, database: process.env.DB_NAME,
                    port: Number(process.env.DB_PORT || 3306), connectTimeout: 8000,
                  });
                } catch (e) { console.log("DB_CONNECT_FAILED " + e.code); return; }
                const [tables] = await c.query("SHOW TABLES");
                const names = tables.map(r => Object.values(r)[0])
                  .filter(n => /proxy|writehuman|account|session|lease|vault/i.test(n));
                console.log("TABLES " + names.join(" "));
                for (const t of names.slice(0, 12)) {
                  const [cols] = await c.query("SHOW COLUMNS FROM ??", [t]);
                  const safe = cols.map(x => x.Field)
                    .filter(f => !/cookie|token|secret|password|payload|bundle|value|data|blob/i.test(f));
                  const [[n]] = await c.query("SELECT COUNT(*) AS n FROM ??", [t]);
                  console.log(`TABLE ${t} rows=${n.n} safecols=${safe.join(",")}`);
                }
                await c.end();
              })().catch(e => console.log("DB_ERROR " + (e.code || e.message)));
            ' 2>&1 | head -40
          else
            echo "no .env under ${API:-none} — skipping"
          fi

          # 4. The gateway's OWN alignment log — safeLog already emits identifiers only.
          echo "== ALIGNMENT LOG (last 25) =="
          find "$HOME" -maxdepth 4 -name '*.log' -newermt '-7 days' 2>/dev/null | head -20 | while read -r L; do
            n=$(grep -c 'supabase_session_align' "$L" 2>/dev/null || echo 0)
            [ "$n" = "0" ] && continue
            echo "-- $L ($n lines)"
            grep 'supabase_session_align' "$L" 2>/dev/null | tail -25
          done

          # 5. Promotion / verification events in whatever logs exist.
          echo "== PROMOTION + VERIFY EVENTS (last 25) =="
          find "$HOME" -maxdepth 4 -name '*.log' -newermt '-7 days' 2>/dev/null | head -20 | while read -r L; do
            n=$(grep -cE 'promot|candidate_sync|verification|canary|executeLogin' "$L" 2>/dev/null || echo 0)
            [ "$n" = "0" ] && continue
            echo "-- $L ($n lines)"
            grep -E 'promot|candidate_sync|verification|canary' "$L" 2>/dev/null | tail -25
          done

          # 5b. DOES THE RUNNING BACKEND HAVE AN AGENT -> EXTENSION-TOOL COOKIE SYNC?
          #     Extension-based tools read Tool.sessionBundle (via /extension/tools/:id/credentials);
          #     the proxy vault (ProxyAccount.sessionEncrypted) is a different store that only the
          #     gateway serves. In THIS repository the only writer of Tool.sessionBundle is the admin
          #     route toolsEnhanced.js, so nothing propagates agent-captured cookies to the
          #     extension's store. The operator reports such a sync existed, and live code is known
          #     to diverge from the repository, so the running tree is the place to settle it.
          echo "== EXTENSION-TOOL COOKIE SYNC IN RUNNING CODE =="
          if [ -n "${API:-}" ]; then
            echo "-- files that WRITE Tool.sessionBundle --"
            grep -rln "sessionBundle" "$API/routes" "$API/utils" "$API/cron" "$API/services" 2>/dev/null | head -20 | while read -r f; do
              w=$(grep -cE "sessionBundle(\.[a-zA-Z]+)?\s*=|sessionBundle\s*=\s*\{" "$f" 2>/dev/null); w=${w:-0}
              echo "   ${f#$API/}  writes=$w"
            done
            echo "-- routes whose path mentions an extension/cookie sync --"
            grep -rnoE "router\.(get|post|put)\('[^']*(sync|cookie|credential)[^']*'" "$API/routes" 2>/dev/null | sed "s#^$API/##" | head -20
            echo "-- any cron/scheduler that could propagate cookies --"
            ls -1 "$API/cron" 2>/dev/null | head -12
            echo "-- writehuman-v2 style /v2 ingest present in the running API? --"
            n=$(grep -rl "v2/cookies/ingest\|cookies/ingest" "$API" 2>/dev/null | head -5 | wc -l); echo "   matches=$n"
          fi

          # 6. When was the API last deployed?
          echo "== LAST DEPLOY =="
          ls -1t "$HOME/hbuilds/logs" 2>/dev/null | head -3 | while read -r d; do
            f=$(ls -1t "$HOME/hbuilds/logs/$d"/*deploy.log 2>/dev/null | head -1)
            [ -n "$f" ] && echo "$d $(date -u -r "$f" +%Y-%m-%dT%H:%M:%SZ) $(basename "$f")"
          done
          echo "== END =="
          REMOTE
          rc=$?
          echo "ssh rc=$rc"
          # Redaction belt-and-braces: never let a long opaque token-shaped string through.
          sed -E 's/(eyJ[A-Za-z0-9_-]{6})[A-Za-z0-9_.-]+/\1<redacted-jwt>/g; s/([A-Za-z0-9_-]{40})[A-Za-z0-9_-]{20,}/\1<redacted>/g' diag.txt > diag.safe.txt || cp diag.txt diag.safe.txt
          cat diag.safe.txt
          head -20 diag.err || true
          cp diag.safe.txt "$RUNNER_TEMP/" 2>/dev/null || true

      - name: Emit the findings
        if: always()
        run: |
          set -uo pipefail
          emit() { printf '::notice title=%s::%s\n' "$1" "$2"; }
          S=diag.safe.txt
          emit "running-api"  "$(sed -n '/== RUNNING API ==/,/== PROMOTION GATE/p' $S 2>/dev/null | tr '\n' '|' | cut -c1-420)"
          emit "promo-gate"   "$(sed -n '/== PROMOTION GATE/,/== RUNNING GATEWAY/p' $S 2>/dev/null | tr '\n' '|' | cut -c1-420)"
          emit "gateways"     "$(sed -n '/== RUNNING GATEWAYS/,/== VAULT SESSION/p' $S 2>/dev/null | tr '\n' '|' | cut -c1-420)"
          emit "vault-meta"   "$(sed -n '/== VAULT SESSION METADATA/,/== ALIGNMENT LOG/p' $S 2>/dev/null | tr '\n' '|' | cut -c1-420)"
          emit "align-log"    "$(sed -n '/== ALIGNMENT LOG/,/== PROMOTION + VERIFY/p' $S 2>/dev/null | tail -12 | tr '\n' '|' | cut -c1-420)"
          emit "promo-events" "$(sed -n '/== PROMOTION + VERIFY/,/== LAST DEPLOY/p' $S 2>/dev/null | tail -12 | tr '\n' '|' | cut -c1-420)"
          emit "ext-sync"     "$(sed -n '/== EXTENSION-TOOL COOKIE SYNC/,/== LAST DEPLOY/p' $S 2>/dev/null | tr '\n' '|' | cut -c1-420)"
          emit "last-deploy"  "$(sed -n '/== LAST DEPLOY/,/== END/p' $S 2>/dev/null | tr '\n' '|' | cut -c1-420)"

      - name: Keep the transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wh-diagnostics
          path: ${{ runner.temp }}/diag.safe.txt
          if-no-files-found: warn

  extcheck:
    name: Inspect the live extension package (read-only)
    if: ${{ inputs.confirm == 'EXTCHECK' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download and inspect what clients are being served
        run: |
          set -euo pipefail
          mkdir -p live && cd live
          exec > >(tee report.txt) 2>&1
          for o in https://genzdigitalstore.com https://app.genzdigitalstore.com; do
            n="$(echo "$o" | sed 's#https://##; s#\.#_#g')"
            code="$(curl -sL -o "$n.zip" -w '%{http_code}' --max-time 120 "$o/downloads/genz-digital-store-extension.zip?cb=$RANDOM")"
            echo "ORIGIN $o -> HTTP $code $(stat -c %s "$n.zip") bytes sha256 $(sha256sum "$n.zip" | cut -d' ' -f1)"
          done
          Z=genzdigitalstore_com.zip
          mkdir -p x && (cd x && unzip -q -o "../$Z")
          echo "ENTRIES $(unzip -Z1 "$Z" | wc -l)"
          node -e 'const m=require("./x/manifest.json");console.log("MANIFEST version="+m.version+" mv="+m.manifest_version+" perms="+(m.permissions||[]).slice().sort().join(",")+" hostperms="+((m.host_permissions||[]).length))'
          # Classify BOTH served packages through the shared transformation module. The previous
          # verdict here was `hasAccessor ? "ALREADY_FIXED"`, which is the very check that let the
          # self-recursive v3.9.36 pass: that package HAS an accessor and the accessor is the bug.
          mkdir -p x2 && (cd x2 && unzip -q -o "../app_genzdigitalstore_com.zip")
          node --input-type=module -e '
            import fs from "fs";
            import { classify, countAccessorCalls, codeOf } from "../scripts/lib/orchestratorAccessor.mjs";
            for (const [tag, dir] of [["genzdigitalstore.com", "x"], ["app.genzdigitalstore.com", "x2"]]) {
              const src = fs.readFileSync(`${dir}/js/background.js`, "utf8");
              const code = codeOf(src);
              const state = classify(src).state;
              const bare = (code.match(/(?<!require)[Oo]rchestrator\.executeLogin\(/g) || []).length;
              console.log(`LIVEBG ${tag} v${JSON.parse(fs.readFileSync(dir + "/manifest.json","utf8")).version} state=${state} bare=${bare} viaAccessor=${countAccessorCalls(src)} bytes=${src.length}`);
              console.log(`VERDICT ${tag} ${state === "correct" ? "RUNNABLE_ACCESSOR" : state === "recursive" ? "SELF_RECURSIVE_DEFECT" : state === "absent" ? "NULL_CRASH_DEFECT" : "SHAPE_UNRECOGNISED"}`);
            }
          '
          node -e '
            const fs = require("fs"), crypto = require("crypto");
            const h = (p) => crypto.createHash("sha256").update(fs.readFileSync(p)).digest("hex").slice(0, 16);
            const live = h("x/js/background.js"), repo = h("../chrome-extension/js/background.js");
            console.log("BGHASH live=" + live + " (" + fs.statSync("x/js/background.js").size + "B) repo=" + repo + " (" + fs.statSync("../chrome-extension/js/background.js").size + "B) " + (live === repo ? "IDENTICAL" : "DIFFERENT"));
          '
          (cd x && find . -type f | sed 's#^\./##' | sort | while read -r f; do
            if [ -f "../../chrome-extension/$f" ]; then
              a="$(sha256sum "$f" | cut -c1-12)"; b="$(sha256sum "../../chrome-extension/$f" | cut -c1-12)"
              if [ "$a" != "$b" ]; then echo "DIFF $f"; fi
            else
              echo "LIVEONLY $f"
            fi
          done) | head -40

      # EXECUTE the served bytes. Classification is a text property; this drives the real
      # registered message handler out of the package clients actually download.
      - name: Run the message-handler suite against the SERVED package
        run: |
          set -euo pipefail
          A="$(sha256sum live/genzdigitalstore_com.zip | cut -d' ' -f1)"
          B="$(sha256sum live/app_genzdigitalstore_com.zip | cut -d' ' -f1)"
          echo "ORIGINS_IDENTICAL=$([ "$A" = "$B" ] && echo yes || echo NO)"
          [ "$A" = "$B" ] || echo "::warning::the two origins serve different bytes"
          EXT_DIR="$PWD/live/x" node --test chrome-extension/test/workerWakeOrchestrator.test.js
          echo "::notice title=served-bytes-tested::the handler suite passed against the package served from genzdigitalstore.com"
      - name: Emit the findings
        if: always()
        run: |
          set -uo pipefail
          f=live/report.txt
          [ -f "$f" ] || { echo "::error::no report produced"; exit 1; }
          emit() { printf '::notice title=%s::%s\n' "$1" "$2"; }
          emit "origins"  "$(grep '^ORIGIN ' "$f" | tr '\n' '|' | cut -c1-420)"
          emit "manifest" "$(grep -m1 '^MANIFEST ' "$f" | cut -c1-420)  $(grep -m1 '^ENTRIES ' "$f")"
          emit "live-bg"  "$(grep -m1 '^LIVEBG ' "$f" | cut -c1-420)"
          emit "verdict"  "$(grep -m1 '^VERDICT ' "$f")  $(grep -m1 '^BGHASH ' "$f" | cut -c1-300)"
          emit "drift"    "$(grep -E '^(DIFF|LIVEONLY) ' "$f" | head -12 | tr '\n' '|' | cut -c1-420)"
          emit "drift2"   "$(grep -cE '^DIFF ' "$f") files differ, $(grep -cE '^LIVEONLY ' "$f") live-only files"

  # ── The Chrome extension package ─────────────────────────────────────────────────────────────
  # A frontend upload does not update an already-installed extension, and the extension is not
  # part of the API's deployment either. What a client receives is the ZIP sitting in the two web
  # docroots' downloads/ directories — the same two paths the backend reads to answer "latest
  # version" (backend/utils/extensionDownloads.js DEFAULT_DIRS). So this job ships exactly those
  # two files and nothing else: no frontend bundle, no backend, no restart.
  #
  # resolveServedRelease() takes the OLDEST version when the two directories disagree, so both are
  # written or the release does not advance.
  #
  # The admin panel can also publish a ZIP straight to these docroots. A live version NEWER than
  # the one in this branch is therefore someone else's release and is never overwritten — the same
  # rule scripts/extension-live-guard.mjs applies during a frontend deploy.
  extension:
    name: Release the extension package (v in chrome-extension/manifest.json)
    if: ${{ inputs.confirm == 'EXTENSION' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # GATE 1 — build the artifact FROM THE LIVE PACKAGE, and prove what changed inside it.
      #
      # NOT from chrome-extension/. Measured on 2026-10-18: the served package is v3.9.35 with 48
      # entries, its js/background.js is 171,372 bytes, and 29 files differ from this branch with 10
      # live-only — while this repository's source is v3.9.31 with 40 entries and a 158,947-byte
      # background.js. Versions 3.9.32-3.9.35 were published from a tree that is not in git, so
      # building from source would DELETE ten files and revert twenty-nine.
      #
      # patch-live-extension.mjs therefore takes the live bytes, changes exactly one file, bumps the
      # version, and refuses outright if the live code is not the shape it expects or has already
      # been fixed. It then re-opens its own output and proves the entry count, permissions, key and
      # every other file are untouched.
      - name: Patch the live package and verify the result
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y zip unzip
          cd chrome-extension && npm test && cd ..
          node scripts/patch-live-extension.mjs --out "$RUNNER_TEMP/extout"
          ls -la "$RUNNER_TEMP/extout"
          echo "EXT_ZIP=$RUNNER_TEMP/extout/genz-digital-store-extension.zip" >> "$GITHUB_ENV"

      # GATE 2 — EXECUTE THE BYTES THAT ARE ABOUT TO BE SERVED.
      #
      # This is the gate v3.9.36 needed and did not have. Its accessor called itself, so a cold
      # message-driven wake overflowed the stack and the singleton factory was never reached — while
      # every structural check passed, because not one of them ran the code. A warm worker worked,
      # which is exactly why it got published.
      #
      # So the ZIP that is about to be uploaded is extracted here and the REAL registered message
      # handler is driven out of those exact files (EXT_DIR), plus the transformation suite that
      # executes a patched package's cold wake, repeat calls, warm init, independent wakes,
      # concurrent Access and a failing factory. A failure here stops the release before anything is
      # served; it does not touch the host.
      - name: Run the message-handler suite against the FINAL packaged bytes
        run: |
          set -euo pipefail
          FINAL="$RUNNER_TEMP/final-pkg"
          rm -rf "$FINAL" && mkdir -p "$FINAL"
          unzip -q -o "$EXT_ZIP" -d "$FINAL"
          export FINAL
          node --input-type=module -e '
            import fs from "fs";
            import { classify, countAccessorCalls } from "./scripts/lib/orchestratorAccessor.mjs";
            const src = fs.readFileSync(process.env.FINAL + "/js/background.js", "utf8");
            const state = classify(src).state;
            const via = countAccessorCalls(src);
            console.log(`packaged accessor state=${state} viaAccessor=${via}`);
            if (state !== "correct") { console.error(`::error::packaged accessor state is ${state}`); process.exit(1); }
            if (via < 1) { console.error("::error::no call site routed through the accessor"); process.exit(1); }
          '
          node --test chrome-extension/test/releasePatchTransform.test.js
          EXT_DIR="$FINAL" node --test chrome-extension/test/workerWakeOrchestrator.test.js
          echo "::notice title=packaged-bytes-tested::the handler suite ran against the extracted release ZIP, not the source tree"

      - name: Install deploy key and PINNED host key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.HOSTINGER_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_PRIVATE_KEY:-}" ] || [ -z "${SSH_KNOWN_HOSTS:-}" ]; then
            echo "::error::HOSTINGER_SSH_PRIVATE_KEY and HOSTINGER_SSH_KNOWN_HOSTS must both be set in the 'production' environment."; exit 1
          fi
          D="$RUNNER_TEMP/ext-ssh"; mkdir -p "$D" && chmod 700 "$D"; umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$D/id_deploy"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$D/known_hosts"
          chmod 600 "$D/id_deploy" "$D/known_hosts"
          grep -q 'PRIVATE KEY' "$D/id_deploy" || { echo "::error::the stored key has no PRIVATE KEY header"; exit 1; }
          ssh-keygen -F "[${SFTP_HOST}]:${SFTP_PORT}" -f "$D/known_hosts" >/dev/null 2>&1 \
            || { echo "::error::known_hosts has no entry for [${SFTP_HOST}]:${SFTP_PORT}"; exit 1; }
          echo "SSH_DIR=$D" >> "$GITHUB_ENV"

      - name: Unlock the key if encrypted
        env:
          SSH_PASSPHRASE: ${{ secrets.HOSTINGER_SSH_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_PASSPHRASE:-}" ]; then echo "key treated as unencrypted"; exit 0; fi
          eval "$(ssh-agent -s)" >/dev/null
          ASK="$SSH_DIR/askpass.sh"; umask 077
          printf '#!/usr/bin/env bash\nprintf "%%s\\n" "$SSH_PASSPHRASE"\n' > "$ASK"; chmod 700 "$ASK"
          SSH_ASKPASS="$ASK" SSH_ASKPASS_REQUIRE=force DISPLAY=:0 ssh-add "$SSH_DIR/id_deploy" >/dev/null 2>&1 \
            || { echo "::error::ssh-add rejected the key"; exit 1; }
          rm -f "$ASK"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      # GATE 2 — what each docroot serves now, a hash-verified backup, and the newer-live refusal.
      - name: Read the live packages and back them up
        id: extbackup
        run: |
          set -euo pipefail
          O="-i $SSH_DIR/id_deploy -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$SSH_DIR/known_hosts -o BatchMode=yes -o ConnectTimeout=20 -p $SFTP_PORT"
          STAMP="$(date -u +%Y%m%dT%H%M%SZ)"; echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          # shellcheck disable=SC2086
          ssh $O "$SFTP_USER@$SFTP_HOST" "STAMP='$STAMP' NEWV='$EXT_VERSION' bash -s" > extpre.txt 2>extpre.err <<'REMOTE'
          set -u
          Z=genz-digital-store-extension.zip
          newer=0
          for d in "$HOME/domains/genzdigitalstore.com/public_html/downloads" "$HOME/domains/app.genzdigitalstore.com/public_html/downloads"; do
            p="$d/$Z"
            if [ ! -f "$p" ]; then echo "live $d: ABSENT"; continue; fi
            # The manifest version, read straight out of the live ZIP.
            v="$(unzip -p "$p" manifest.json 2>/dev/null | grep -oE '"version"[[:space:]]*:[[:space:]]*"[^"]+"' | head -1 | sed -E 's/.*"([^"]+)"$/\1/')"
            echo "live $d: v${v:-?} $(stat -c %s "$p") bytes sha256 $(sha256sum "$p" | cut -d' ' -f1)"
            b="$d/.backup-$Z.$STAMP"
            cp -p "$p" "$b"
            a="$(sha256sum "$p" | cut -d' ' -f1)"; c="$(sha256sum "$b" | cut -d' ' -f1)"
            if [ "$a" = "$c" ]; then echo "backup VERIFIED $b"; else echo "BACKUP_FAILED $b"; fi
            # Numeric comparison, never string: 3.9.9 must not look newer than 3.9.32.
            if [ -n "${v:-}" ] && [ "$(printf '%s\n%s\n' "$v" "$NEWV" | sort -V | tail -1)" = "$v" ] && [ "$v" != "$NEWV" ]; then
              echo "LIVE_IS_NEWER $d ($v > $NEWV)"; newer=1
            fi
          done
          [ "$newer" = "0" ] && echo "SAFE_TO_PUBLISH" || echo "REFUSE_NEWER_LIVE"
          REMOTE
          cat extpre.txt
          { echo "## Extension before"; echo ''; echo '```'; cat extpre.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          # Emitted BEFORE the guards: when the run refuses, the live versions are the one thing
          # needed to decide what to do next, and a summary this client cannot read is no help.
          echo "::notice title=ext-before::$(grep -m2 '^live ' extpre.txt | tr '\n' '|' | cut -c1-400)"
          echo "::notice title=ext-guard::$(grep -m2 -E 'LIVE_IS_NEWER|SAFE_TO_PUBLISH|REFUSE_NEWER_LIVE' extpre.txt | tr '\n' '|' | cut -c1-300)"
          grep -q BACKUP_FAILED extpre.txt && { echo "::error::a rollback copy could not be verified; nothing was changed"; exit 1; }
          grep -q REFUSE_NEWER_LIVE extpre.txt && { echo "::error::a docroot already serves a NEWER package than this branch — refusing to overwrite someone else's release"; exit 1; }
          grep -q SAFE_TO_PUBLISH extpre.txt || { echo "::error::could not establish the live state"; head -5 extpre.err || true; exit 1; }

      - name: Upload to both docroots, verify on the host, then promote
        run: |
          set -euo pipefail
          LFTP_COMMON="set sftp:auto-confirm no; set sftp:connect-program \"ssh -a -x -i $SSH_DIR/id_deploy -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$SSH_DIR/known_hosts -o BatchMode=yes\"; set net:max-retries 5; set net:timeout 60;"
          UP="$RUNNER_TEMP/extup"; rm -rf "$UP"; mkdir -p "$UP"
          cp "$EXT_ZIP" "$UP/.staging-ext-$STAMP.zip"
          for target in domains/genzdigitalstore.com/public_html/downloads domains/app.genzdigitalstore.com/public_html/downloads; do
            attempt=1
            while :; do
              echo "==> uploading to $target (attempt $attempt/3)"
              if (cd "$UP" && lftp -u "$SFTP_USER," "sftp://$SFTP_HOST:$SFTP_PORT" -e \
                   "$LFTP_COMMON cd $target; put -c .staging-ext-$STAMP.zip; bye"); then break; fi
              if [ "$attempt" -ge 3 ]; then echo "::error::upload to $target failed; nothing was promoted"; exit 1; fi
              attempt=$((attempt + 1)); sleep $((attempt * 10))
            done
          done
          O="-i $SSH_DIR/id_deploy -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$SSH_DIR/known_hosts -o BatchMode=yes -o ConnectTimeout=20 -p $SFTP_PORT"
          # shellcheck disable=SC2086
          ssh $O "$SFTP_USER@$SFTP_HOST" "STAMP='$STAMP' EXT_SHA='$EXT_SHA' EXT_SIZE='$EXT_SIZE' bash -s" > extput.txt 2>extput.err <<'REMOTE'
          set -u
          Z=genz-digital-store-extension.zip
          ok=1
          for d in "$HOME/domains/genzdigitalstore.com/public_html/downloads" "$HOME/domains/app.genzdigitalstore.com/public_html/downloads"; do
            s="$d/.staging-ext-$STAMP.zip"
            if [ ! -f "$s" ]; then echo "STAGING_MISSING $d"; ok=0; continue; fi
            sz="$(stat -c %s "$s")"; sh="$(sha256sum "$s" | cut -d' ' -f1)"
            echo "staged $d: $sz bytes sha256 $sh"
            if [ "$sz" != "$EXT_SIZE" ] || [ "$sh" != "$EXT_SHA" ]; then echo "STAGING_MISMATCH $d"; rm -f "$s"; ok=0; fi
          done
          if [ "$ok" != "1" ]; then echo "NOT_PROMOTED"; exit 0; fi
          # Both verified: promote both, back to back.
          for d in "$HOME/domains/genzdigitalstore.com/public_html/downloads" "$HOME/domains/app.genzdigitalstore.com/public_html/downloads"; do
            mv -f "$d/.staging-ext-$STAMP.zip" "$d/$Z"
            echo "promoted $d: $(stat -c %s "$d/$Z") bytes sha256 $(sha256sum "$d/$Z" | cut -d' ' -f1)"
          done
          echo "EXT_PROMOTED_OK"
          REMOTE
          cat extput.txt
          grep -qE 'STAGING_MISMATCH|STAGING_MISSING' extput.txt && { echo "::error::a staged package did not match; nothing was promoted"; exit 1; }
          grep -q EXT_PROMOTED_OK extput.txt || { echo "::error::promotion did not complete"; head -5 extput.err || true; exit 1; }
          { echo "## Extension promotion"; echo ''; echo '```'; cat extput.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # GATE 3 — what a client actually downloads, and what the admin view now reports.
      - name: Verify both origins and the published version
        run: |
          set -euo pipefail
          O="-i $SSH_DIR/id_deploy -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$SSH_DIR/known_hosts -o BatchMode=yes -o ConnectTimeout=20 -p $SFTP_PORT"
          # shellcheck disable=SC2086
          ssh $O "$SFTP_USER@$SFTP_HOST" "EXT_SHA='$EXT_SHA' EXT_SIZE='$EXT_SIZE' EXT_VERSION='$EXT_VERSION' bash -s" > extver.txt 2>extver.err <<'REMOTE'
          set -u
          cd "$(mktemp -d)"
          allok=1
          for o in https://genzdigitalstore.com https://app.genzdigitalstore.com; do
            u="$o/downloads/genz-digital-store-extension.zip"
            code="$(curl -s -o z.zip -w '%{http_code}' --max-time 120 "$u?cb=$RANDOM")"
            sz="$(stat -c %s z.zip 2>/dev/null || echo 0)"; sh="$(sha256sum z.zip 2>/dev/null | cut -d' ' -f1)"
            v="$(unzip -p z.zip manifest.json 2>/dev/null | grep -oE '"version"[[:space:]]*:[[:space:]]*"[^"]+"' | head -1 | sed -E 's/.*"([^"]+)"$/\1/')"
            echo "$o -> HTTP $code  $sz bytes  v${v:-?}  sha256 ${sh:-none}"
            if [ "$code" != "200" ] || [ "$sz" != "$EXT_SIZE" ] || [ "$sh" != "$EXT_SHA" ] || [ "$v" != "$EXT_VERSION" ]; then allok=0; fi
          done
          [ "$allok" = "1" ] && echo "ORIGINS_MATCH" || echo "ORIGINS_MISMATCH"
          # The admin "latest version" reads the same two files from disk, so report what the API
          # now says. Unauthenticated: the STATUS is the fact, the body may be a refusal.
          printf 'api version-info -> '
          curl -s -o vi.json -w 'HTTP %{http_code} ' --max-time 25 "https://api.genzdigitalstore.com/api/crm/extension/version-info"
          head -c 240 vi.json; echo
          REMOTE
          cat extver.txt
          { echo "## Extension verification"; echo ''; echo '```'; cat extver.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          emit() { printf '::notice title=%s::%s\n' "$1" "$2"; }
          emit "ext-origins" "$(grep -E '\-> HTTP' extver.txt | tr '\n' '|' | cut -c1-420)"
          emit "ext-api"     "$(grep -m1 'api version-info' extver.txt | cut -c1-400)"
          grep -q ORIGINS_MATCH extver.txt || { echo "::error::a member origin does not serve the new package"; exit 1; }

      - name: Roll the packages back
        if: ${{ failure() && steps.extbackup.outcome == 'success' }}
        run: |
          set -uo pipefail
          O="-i $SSH_DIR/id_deploy -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$SSH_DIR/known_hosts -o BatchMode=yes -o ConnectTimeout=20 -p $SFTP_PORT"
          # shellcheck disable=SC2086
          ssh $O "$SFTP_USER@$SFTP_HOST" "STAMP='$STAMP' bash -s" > extrb.txt 2>&1 <<'REMOTE'
          set -u
          Z=genz-digital-store-extension.zip
          for d in "$HOME/domains/genzdigitalstore.com/public_html/downloads" "$HOME/domains/app.genzdigitalstore.com/public_html/downloads"; do
            b="$d/.backup-$Z.$STAMP"
            if [ -f "$b" ]; then cp -p "$b" "$d/$Z"; echo "restored $d $(sha256sum "$d/$Z" | cut -d' ' -f1)"; fi
            rm -f "$d/.staging-ext-$STAMP.zip"
          done
          echo "EXT_ROLLED_BACK"
          REMOTE
          cat extrb.txt
          { echo "## Extension rollback"; echo ''; echo '```'; cat extrb.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::the extension packages were rolled back"

  # ── The WriteHuman client gateway, deployed on its own ────────────────────────────────────────
  # The gateway is a SEPARATE Passenger application from the API: it is not touched by the main
  # branch's auto-deploy, so this fix cannot ride along with a backend release. One file changes
  # (proxy-gateway/server.js), and the live copy is backed up and hash-verified first.
  #
  # WHAT THE CHANGE DOES. injectSupabaseBrowserSession decided whether to seed the member's browser
  # with the vault's Supabase session by reading a `__genz_sb` marker out of localStorage inside a
  # try/catch. Where storage on the gateway origin is unavailable or throws, the catch swallowed it
  # and the session was NEVER seeded — the member sees WriteHuman's own logged-out page while every
  # server-side signal stays healthy. The decision is now made server-side from the generation
  # (access-token `iat`) the browser sent: behind the vault, seed; level or ahead, leave it alone.
  #
  # RESTART: Passenger's documented restart file, which the gateway's own .htaccess names
  # (PassengerRestartDir .../tmp). No process is killed and nothing else on the account restarts.
  gateway:
    name: Deploy the WriteHuman gateway session-alignment fix
    if: ${{ inputs.confirm == 'GATEWAY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # GATE 1 — the change has to pass its own tests on the runner before it reaches the host.
      - name: Run the gateway's integration tests
        working-directory: proxy-gateway
        run: |
          set -euo pipefail
          node --check server.js
          npm test

      - name: Install deploy key and PINNED host key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.HOSTINGER_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_PRIVATE_KEY:-}" ] || [ -z "${SSH_KNOWN_HOSTS:-}" ]; then
            echo "::error::HOSTINGER_SSH_PRIVATE_KEY and HOSTINGER_SSH_KNOWN_HOSTS must both be set in the 'production' environment."
            exit 1
          fi
          D="$RUNNER_TEMP/gw-ssh"
          mkdir -p "$D" && chmod 700 "$D"
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$D/id_deploy"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$D/known_hosts"
          chmod 600 "$D/id_deploy" "$D/known_hosts"
          grep -q 'PRIVATE KEY' "$D/id_deploy" || { echo "::error::the stored key has no PRIVATE KEY header"; exit 1; }
          ssh-keygen -F "[${SFTP_HOST}]:${SFTP_PORT}" -f "$D/known_hosts" >/dev/null 2>&1 \
            || { echo "::error::known_hosts has no entry for [${SFTP_HOST}]:${SFTP_PORT}; host-key checking is NOT being disabled"; exit 1; }
          echo "SSH_DIR=$D" >> "$GITHUB_ENV"

      - name: Unlock the key if encrypted
        env:
          SSH_PASSPHRASE: ${{ secrets.HOSTINGER_SSH_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_PASSPHRASE:-}" ]; then echo "key treated as unencrypted"; exit 0; fi
          eval "$(ssh-agent -s)" >/dev/null
          ASK="$SSH_DIR/askpass.sh"; umask 077
          printf '#!/usr/bin/env bash\nprintf "%%s\\n" "$SSH_PASSPHRASE"\n' > "$ASK"; chmod 700 "$ASK"
          SSH_ASKPASS="$ASK" SSH_ASKPASS_REQUIRE=force DISPLAY=:0 ssh-add "$SSH_DIR/id_deploy" >/dev/null 2>&1 \
            || { echo "::error::ssh-add rejected the key"; exit 1; }
          rm -f "$ASK"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      # GATE 2 — identify the live file and keep a hash-verified copy of it.
      - name: Back up the live gateway, hash-verified
        id: gwbackup
        run: |
          set -euo pipefail
          O="-i $SSH_DIR/id_deploy -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$SSH_DIR/known_hosts -o BatchMode=yes -o ConnectTimeout=20 -p $SFTP_PORT"
          STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          # shellcheck disable=SC2086
          ssh $O "$SFTP_USER@$SFTP_HOST" "STAMP='$STAMP' bash -s" > gwpre.txt 2>gwpre.err <<'REMOTE'
          set -u
          G="$HOME/writehuman-gateway"
          B="$G/backup-server-$STAMP.js"
          [ -f "$G/server.js" ] || { echo "NO_SERVER_JS"; exit 0; }
          echo "live server.js: $(stat -c %s "$G/server.js") bytes sha256 $(sha256sum "$G/server.js" | cut -d' ' -f1) mtime $(stat -c %y "$G/server.js" | cut -c1-19)"
          cp -p "$G/server.js" "$B"
          a="$(sha256sum "$G/server.js" | cut -d' ' -f1)"; b="$(sha256sum "$B" | cut -d' ' -f1)"
          if [ "$a" = "$b" ]; then echo "backup VERIFIED $B"; else echo "BACKUP_FAILED"; fi
          echo "markers now: HOST_GUARD_INDIRECT=$(grep -c HOST_GUARD_INDIRECT_RE "$G/server.js") align=$(grep -c shouldAlignBrowserSession "$G/server.js")"
          REMOTE
          cat gwpre.txt
          grep -q 'backup VERIFIED' gwpre.txt || { echo "::error::could not take a verified backup of the live gateway; nothing was changed"; head -5 gwpre.err || true; exit 1; }
          { echo "## Gateway before"; echo ''; echo '```'; cat gwpre.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=gw-before::$(grep -m1 'live server.js:' gwpre.txt) | $(grep -m1 'markers now:' gwpre.txt)"

      - name: Upload, syntax-check on the host, then restart
        run: |
          set -euo pipefail
          LFTP_COMMON="set sftp:auto-confirm no; set sftp:connect-program \"ssh -a -x -i $SSH_DIR/id_deploy -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$SSH_DIR/known_hosts -o BatchMode=yes\"; set net:max-retries 5; set net:timeout 60;"
          UP="$RUNNER_TEMP/gwup"; rm -rf "$UP"; mkdir -p "$UP"
          cp proxy-gateway/server.js "$UP/.staging-server-$STAMP.js"
          attempt=1
          while :; do
            echo "==> uploading the gateway (attempt $attempt/3)"
            if (cd "$UP" && lftp -u "$SFTP_USER," "sftp://$SFTP_HOST:$SFTP_PORT" -e \
                 "$LFTP_COMMON cd writehuman-gateway; put -c .staging-server-$STAMP.js; bye"); then break; fi
            if [ "$attempt" -ge 3 ]; then echo "::error::upload failed; nothing was changed"; exit 1; fi
            attempt=$((attempt + 1)); sleep $((attempt * 10))
          done
          LOCAL_SHA="$(sha256sum proxy-gateway/server.js | cut -d' ' -f1)"
          O="-i $SSH_DIR/id_deploy -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$SSH_DIR/known_hosts -o BatchMode=yes -o ConnectTimeout=20 -p $SFTP_PORT"
          # shellcheck disable=SC2086
          ssh $O "$SFTP_USER@$SFTP_HOST" "STAMP='$STAMP' LOCAL_SHA='$LOCAL_SHA' bash -s" > gwput.txt 2>gwput.err <<'REMOTE'
          set -u
          G="$HOME/writehuman-gateway"
          S="$G/.staging-server-$STAMP.js"
          sh="$(sha256sum "$S" | cut -d' ' -f1)"
          echo "staged: $(stat -c %s "$S") bytes sha256 $sh"
          if [ "$sh" != "$LOCAL_SHA" ]; then echo "STAGING_MISMATCH"; rm -f "$S"; exit 0; fi
          # A file that does not parse must never become server.js: Passenger would then serve 503
          # to every member on the next request.
          if ! node --check "$S" 2>/dev/null; then
            if ! /opt/alt/alt-nodejs22/root/bin/node --check "$S" 2>/dev/null; then
              echo "SYNTAX_FAILED"; rm -f "$S"; exit 0
            fi
          fi
          echo "syntax OK on the host"
          mv -f "$S" "$G/server.js"
          echo "installed: $(stat -c %s "$G/server.js") bytes sha256 $(sha256sum "$G/server.js" | cut -d' ' -f1)"
          mkdir -p "$G/tmp" && touch "$G/tmp/restart.txt"
          echo "restart requested via Passenger restart file"
          echo "GATEWAY_OK"
          REMOTE
          cat gwput.txt
          grep -q STAGING_MISMATCH gwput.txt && { echo "::error::the uploaded gateway did not hash to the local file; staging deleted, nothing installed"; exit 1; }
          grep -q SYNTAX_FAILED   gwput.txt && { echo "::error::the uploaded gateway did not parse on the host; staging deleted, nothing installed"; exit 1; }
          grep -q GATEWAY_OK      gwput.txt || { echo "::error::install did not complete"; head -5 gwput.err || true; exit 1; }
          { echo "## Gateway install"; echo ''; echo '```'; cat gwput.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # GATE 3 — the gateway still answers, still contains the host-guard defusal, and now reports
      # the alignment decision. A member page needs a lease, so this checks what is reachable
      # without one: the health route, and that the lease wall is still a wall.
      - name: Verify the gateway is serving
        run: |
          set -euo pipefail
          O="-i $SSH_DIR/id_deploy -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$SSH_DIR/known_hosts -o BatchMode=yes -o ConnectTimeout=20 -p $SFTP_PORT"
          # shellcheck disable=SC2086
          ssh $O "$SFTP_USER@$SFTP_HOST" 'bash -s' > gwver.txt 2>gwver.err <<'REMOTE'
          set -u
          G="$HOME/writehuman-gateway"
          echo "on disk: $(stat -c %s "$G/server.js") bytes sha256 $(sha256sum "$G/server.js" | cut -d' ' -f1)"
          echo "markers: HOST_GUARD_INDIRECT=$(grep -c HOST_GUARD_INDIRECT_RE "$G/server.js") align=$(grep -c shouldAlignBrowserSession "$G/server.js") routeCheck=$(grep -c routeCheck "$G/server.js")"
          for i in 1 2 3 4 5; do
            code="$(curl -s -o h.json -w '%{http_code}' --max-time 25 "https://writehuman1.genzdigitalstore.com/__genz/health?cb=$RANDOM")"
            echo "try $i: /__genz/health HTTP $code"
            [ "$code" = "200" ] && break
            sleep 8
          done
          head -c 420 h.json; echo
          printf 'no-lease request -> '
          curl -s -o /dev/null -w 'HTTP %{http_code}\n' --max-time 25 "https://writehuman1.genzdigitalstore.com/"
          rm -f h.json
          REMOTE
          cat gwver.txt
          { echo "## Gateway verification"; echo ''; echo '```'; cat gwver.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          emit() { printf '::notice title=%s::%s\n' "$1" "$2"; }
          emit "gw-disk"   "$(grep -m1 'on disk:' gwver.txt) | $(grep -m1 'markers:' gwver.txt)"
          emit "gw-health" "$(grep -E '/__genz/health HTTP' gwver.txt | tail -1) | $(grep -m1 -oE '\{"ok".{0,200}' gwver.txt)"
          emit "gw-wall"   "$(grep -m1 'no-lease request ->' gwver.txt)"
          grep -qE '/__genz/health HTTP 200' gwver.txt || { echo "::error::the gateway is not answering its health route after the restart"; exit 1; }
          grep -q 'align=1' gwver.txt || grep -q 'align=2' gwver.txt || grep -q 'align=3' gwver.txt \
            || { echo "::error::the installed gateway does not contain the alignment decision"; exit 1; }

      - name: Roll the gateway back
        if: ${{ failure() && steps.gwbackup.outcome == 'success' }}
        run: |
          set -uo pipefail
          O="-i $SSH_DIR/id_deploy -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$SSH_DIR/known_hosts -o BatchMode=yes -o ConnectTimeout=20 -p $SFTP_PORT"
          # shellcheck disable=SC2086
          ssh $O "$SFTP_USER@$SFTP_HOST" "STAMP='$STAMP' bash -s" > gwrb.txt 2>&1 <<'REMOTE'
          set -u
          G="$HOME/writehuman-gateway"; B="$G/backup-server-$STAMP.js"
          [ -f "$B" ] || { echo "NO_BACKUP"; exit 0; }
          cp -p "$B" "$G/server.js"
          rm -f "$G/.staging-server-$STAMP.js"
          mkdir -p "$G/tmp" && touch "$G/tmp/restart.txt"
          echo "restored $(sha256sum "$G/server.js" | cut -d' ' -f1) and requested a restart"
          echo "ROLLED_BACK"
          REMOTE
          cat gwrb.txt
          { echo "## Gateway rollback"; echo ''; echo '```'; cat gwrb.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::the gateway was rolled back to the pre-deploy file"

  publish:
    name: Publish the verified 3.5.15 installer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Checkout (carries the installer bytes at this ref)
        uses: actions/checkout@v4

      # GATE 1 — the artifact is what the manifest says, before anything is touched.
      - name: Verify the committed artifact against the manifest
        run: |
          set -euo pipefail
          test -f "$MANIFEST"  || { echo "::error::$MANIFEST missing"; exit 1; }
          test -f "$ARTIFACT"  || { echo "::error::$ARTIFACT missing at this ref"; exit 1; }
          V="$(node -e 'const m=require("./"+process.env.MANIFEST);process.stdout.write(m.version)')"
          S="$(node -e 'const m=require("./"+process.env.MANIFEST);process.stdout.write(m.size+"")')"
          H="$(node -e 'const m=require("./"+process.env.MANIFEST);process.stdout.write(m.sha256)')"
          F="$(node -e 'const m=require("./"+process.env.MANIFEST);process.stdout.write(m.file)')"
          AS="$(stat -c %s "$ARTIFACT")"
          AH="$(sha256sum "$ARTIFACT" | cut -d" " -f1)"
          echo "manifest: v$V $S bytes $H ($F)"
          echo "artifact: $AS bytes $AH"
          [ "$AS" = "$S" ] || { echo "::error::size mismatch: artifact $AS, manifest $S"; exit 1; }
          [ "$AH" = "$H" ] || { echo "::error::sha256 mismatch: artifact $AH, manifest $H"; exit 1; }
          [ "$(basename "$ARTIFACT")" = "$F" ] || { echo "::error::filename mismatch"; exit 1; }
          { echo "WH_VERSION=$V"; echo "WH_SIZE=$S"; echo "WH_SHA=$H"; echo "WH_FILE=$F"; } >> "$GITHUB_ENV"
          echo "::notice title=artifact::v$V  $S bytes  sha256 $H  VERIFIED against the manifest"

      - name: Install deploy key and PINNED host key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.HOSTINGER_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_PRIVATE_KEY:-}" ] || [ -z "${SSH_KNOWN_HOSTS:-}" ]; then
            echo "::error::HOSTINGER_SSH_PRIVATE_KEY and HOSTINGER_SSH_KNOWN_HOSTS must both be set in the 'production' environment."
            exit 1
          fi
          D="$RUNNER_TEMP/pub-ssh"
          mkdir -p "$D" && chmod 700 "$D"
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$D/id_deploy"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$D/known_hosts"
          chmod 600 "$D/id_deploy" "$D/known_hosts"
          grep -q 'PRIVATE KEY' "$D/id_deploy" || { echo "::error::the stored key has no PRIVATE KEY header"; exit 1; }
          ssh-keygen -F "[${SFTP_HOST}]:${SFTP_PORT}" -f "$D/known_hosts" >/dev/null 2>&1 \
            || { echo "::error::known_hosts has no entry for [${SFTP_HOST}]:${SFTP_PORT}; host-key checking is NOT being disabled to work around it"; exit 1; }
          echo "SSH_DIR=$D" >> "$GITHUB_ENV"
          echo "Host key PINNED for [${SFTP_HOST}]:${SFTP_PORT}:"
          ssh-keygen -l -f "$D/known_hosts" | sed 's/^/  /'

      - name: Unlock the key if encrypted
        env:
          SSH_PASSPHRASE: ${{ secrets.HOSTINGER_SSH_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_PASSPHRASE:-}" ]; then echo "key treated as unencrypted"; exit 0; fi
          eval "$(ssh-agent -s)" >/dev/null
          ASK="$SSH_DIR/askpass.sh"; umask 077
          printf '#!/usr/bin/env bash\nprintf "%%s\\n" "$SSH_PASSPHRASE"\n' > "$ASK"; chmod 700 "$ASK"
          SSH_ASKPASS="$ASK" SSH_ASKPASS_REQUIRE=force DISPLAY=:0 ssh-add "$SSH_DIR/id_deploy" >/dev/null 2>&1 \
            || { echo "::error::ssh-add rejected the key"; exit 1; }
          rm -f "$ASK"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"

      # Two uploads of this file have now failed — scp with 255, lftp after three attempts — while
      # `ssh … bash -s` on the same key works. On shared hosting the next suspect is writable space,
      # and this job is itself a consumer of it: every run copies the live 87MB exe into a new
      # backup directory. So measure before writing anything, and report what is already there.
      - name: Measure writable space and existing installer copies (read-only)
        run: |
          set -euo pipefail
          O="-i $SSH_DIR/id_deploy -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$SSH_DIR/known_hosts -o BatchMode=yes -o ConnectTimeout=20 -p $SFTP_PORT"
          # shellcheck disable=SC2086
          ssh $O "$SFTP_USER@$SFTP_HOST" 'bash -s' > space.txt 2>space.err <<'REMOTE'
          set -u
          echo "--- quota ---"
          quota -s 2>/dev/null | head -5 || echo "(quota not available)"
          df -h "$HOME" 2>/dev/null | tail -2
          echo "--- installer copies under \$HOME ---"
          du -sm "$HOME"/domains/api.genzdigitalstore.com/writehuman-agent* 2>/dev/null | sort -rn | head -12
          echo "--- total of those ---"
          du -scm "$HOME"/domains/api.genzdigitalstore.com/writehuman-agent* 2>/dev/null | tail -1
          echo "--- staging leftovers ---"
          ls -la "$HOME/writehuman-agent"/.staging-* 2>/dev/null | head -8 || echo "(none)"
          echo "--- largest dirs in \$HOME ---"
          du -sm "$HOME"/* 2>/dev/null | sort -rn | head -10
          REMOTE
          cat space.txt
          { echo "## Writable space"; echo ''; echo '```'; cat space.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          emit() { printf '::notice title=%s::%s\n' "$1" "$2"; }
          emit "quota"    "$(sed -n '/--- quota ---/,/--- installer/p' space.txt | grep -vE '^---' | tr '\n' '|' | cut -c1-420)"
          emit "copies"   "$(sed -n '/installer copies/,/--- total/p' space.txt | grep -E '^[0-9]+' | tr '\n' '|' | cut -c1-420)"
          emit "total"    "$(sed -n '/--- total of those ---/,/--- staging/p' space.txt | grep -E '^[0-9]+' | tr '\n' '|' | cut -c1-200)  staging: $(grep -c 'staging-' space.txt)"
          emit "biggest"  "$(sed -n '/largest dirs/,$p' space.txt | grep -E '^[0-9]+' | head -8 | tr '\n' '|' | cut -c1-420)"

      # WHICH DIRECTORY DOES THE ROUTE ACTUALLY READ?
      #
      # Attempt 4 settled that the promotion works and that the route does not read the result:
      # ~/writehuman-agent held 91,807,232 bytes hashing to 14015d57… and latest.json said 3.5.15,
      # while the public route answered x-agent-version 3.5.3, content-length 91,700,224 and the
      # 08d3cf7c digest, with `cache-control: no-cache` — so nothing in front of it is caching. The
      # route is reading a DIFFERENT file. agentDownload.js resolves
      # `process.env.WH_AGENT_DIST_DIR || path.join(os.homedir(), 'writehuman-agent')`, so either
      # that variable is set in the hPanel app config, or the app's os.homedir() is not this home.
      # Read it from the live processes and find every copy of the installer on the account.
      - name: Resolve the directory the download route actually serves from (read-only)
        run: |
          set -euo pipefail
          O="-i $SSH_DIR/id_deploy -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$SSH_DIR/known_hosts -o BatchMode=yes -o ConnectTimeout=20 -p $SFTP_PORT"
          # shellcheck disable=SC2086
          ssh $O "$SFTP_USER@$SFTP_HOST" 'bash -s' > dist.txt 2>dist.err <<'REMOTE'
          set -u
          echo "--- app processes: HOME, PWD and the dist override ---"
          for p in $(pgrep -u "$(whoami)" node 2>/dev/null); do
            c="$(readlink -f /proc/$p/cwd 2>/dev/null || echo '?')"
            case "$c" in
              *api.genzdigitalstore.com*)
                E="/proc/$p/environ"
                printf 'pid %s cwd=%s\n' "$p" "$c"
                if [ -r "$E" ]; then
                  for k in HOME PWD WH_AGENT_DIST_DIR USER; do
                    printf '   %-20s %s\n' "$k" "$(tr '\0' '\n' < "$E" | grep -m1 "^$k=" | cut -d= -f2- || echo '<unset>')"
                  done
                else
                  echo "   (environ not readable)"
                fi
                ;;
            esac
          done
          echo "--- every installer copy on the account, with identity ---"
          find "$HOME" -maxdepth 4 -name 'WriteHuman-Agent-Setup*.exe' -printf '%s %p\n' 2>/dev/null | sort -rn | while read -r sz pth; do
            printf '%s %s %s\n' "$sz" "$(sha256sum "$pth" | cut -c1-16)" "$pth"
          done | head -20
          echo "--- every latest.json on the account ---"
          find "$HOME" -maxdepth 4 -name 'latest.json' -printf '%p\n' 2>/dev/null | head -10 | while read -r f; do
            printf '%s -> %s\n' "$f" "$(grep -oE '"version"[[:space:]]*:[[:space:]]*"[^"]+"' "$f" | head -1)"
          done
          REMOTE
          cat dist.txt
          { echo "## Which directory the route serves"; echo ''; echo '```'; cat dist.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          emit() { printf '::notice title=%s::%s\n' "$1" "$2"; }
          emit "app-env"   "$(sed -n '/app processes/,/every installer copy/p' dist.txt | grep -E '^pid |^   [A-Z]' | tr -s ' ' | tr '\n' '|' | cut -c1-420)"
          emit "installers" "$(sed -n '/every installer copy/,/every latest.json/p' dist.txt | grep -E '^[0-9]+ ' | head -8 | tr '\n' '|' | cut -c1-420)"
          emit "metafiles"  "$(sed -n '/every latest.json/,$p' dist.txt | grep -E '^/' | head -8 | tr '\n' '|' | cut -c1-420)"

      # GATE 2 — what is published right now, and a VERIFIED rollback copy of it.
      - name: Record the current publication and take a verified backup
        id: backup
        if: ${{ inputs.confirm == 'PUBLISH' }}
        run: |
          set -euo pipefail
          O="-i $SSH_DIR/id_deploy -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$SSH_DIR/known_hosts -o BatchMode=yes -o ConnectTimeout=20 -p $SFTP_PORT"
          STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          # shellcheck disable=SC2086
          ssh $O "$SFTP_USER@$SFTP_HOST" "STAMP='$STAMP' bash -s" > pre.txt 2>pre.err <<'REMOTE'
          set -u
          D="$HOME/domains/api.genzdigitalstore.com/writehuman-agent"
          B="$HOME/domains/api.genzdigitalstore.com/writehuman-agent-backup-$STAMP"
          echo "dist-dir: $D"
          if [ -f "$D/latest.json" ]; then printf 'current latest.json: '; tr -d '\n' < "$D/latest.json"; echo; else echo "current latest.json: ABSENT"; fi
          E="$D/WriteHuman-Agent-Setup-x64.exe"
          if [ -f "$E" ]; then
            echo "current exe: $(stat -c %s "$E") bytes sha256 $(sha256sum "$E" | cut -d' ' -f1)"
          else
            echo "current exe: ABSENT"
          fi
          mkdir -p "$B"
          for f in latest.json WriteHuman-Agent-Setup-x64.exe; do
            if [ -f "$D/$f" ]; then cp -p "$D/$f" "$B/$f"; fi
          done
          ok=1
          for f in latest.json WriteHuman-Agent-Setup-x64.exe; do
            if [ -f "$D/$f" ]; then
              a="$(sha256sum "$D/$f" | cut -d' ' -f1)"
              b="$(sha256sum "$B/$f" | cut -d' ' -f1)"
              if [ "$a" = "$b" ]; then echo "backup VERIFIED $f $a"; else echo "backup MISMATCH $f"; ok=0; fi
            fi
          done
          echo "backup-dir: $B"
          if [ "$ok" = "1" ]; then echo "BACKUP_OK"; else echo "BACKUP_FAILED"; fi
          REMOTE
          cat pre.txt
          grep -q BACKUP_OK pre.txt || { echo "::error::the rollback copy could not be verified; nothing was changed"; head -5 pre.err || true; exit 1; }
          { echo "## Before publish"; echo ''; echo '```'; cat pre.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=before::$(grep -m1 'current exe:' pre.txt) | $(grep -m1 -oE '"version": *"[^"]+"' pre.txt) | backup=$(grep -m1 'backup-dir:' pre.txt | cut -d' ' -f2)"

      - name: Dry run stops here unless confirm=PUBLISH
        if: ${{ inputs.confirm != 'PUBLISH' }}
        run: |
          echo "::warning::confirm was not PUBLISH — the artifact and the rollback copy are verified and NOTHING was promoted."

      - name: Install lftp
        if: ${{ inputs.confirm == 'PUBLISH' }}
        run: sudo apt-get update && sudo apt-get install -y lftp

      # STAGE → VERIFY ON THE HOST → PROMOTE BYTES → PROMOTE METADATA LAST.
      #
      # The transfer uses lftp over the SAME pinned ssh, which is what deploy-frontend.yml already
      # uses successfully against this host. The first attempt here used scp and died with exit 255
      # while `ssh … bash -s` in the step above worked on the same credentials, so the SFTP path
      # this host actually accepts is the one to use. `sftp:auto-confirm no` keeps host-key checking
      # strict inside lftp too, and net:max-retries covers the entry-process refusals this shared
      # host is known to produce.
      - name: Stage, verify on the host, then promote
        if: ${{ inputs.confirm == 'PUBLISH' }}
        run: |
          set -euo pipefail
          O="-i $SSH_DIR/id_deploy -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$SSH_DIR/known_hosts -o BatchMode=yes -o ConnectTimeout=20 -p $SFTP_PORT"
          LFTP_COMMON="set sftp:auto-confirm no; set sftp:connect-program \"ssh -a -x -i $SSH_DIR/id_deploy -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$SSH_DIR/known_hosts -o BatchMode=yes\"; set net:max-retries 5; set net:timeout 60; set net:persist-retries 5; set net:reconnect-interval-base 5;"
          # The metadata the public route will serve. Shape matches what is published today; builtAt
          # stays null because no build time was ever established for these bytes, and an archive
          # timestamp presented as a build time would be a fabrication.
          node -e '
            const m = require("./" + process.env.MANIFEST);
            const out = {
              product: m.product, file: m.file, version: m.version, size: m.size,
              sha256: m.sha256, arch: m.arch, signed: m.signed, builtAt: m.builtAt,
              buildId: m.buildId, notVerified: m.notVerified,
            };
            require("fs").writeFileSync("latest.new.json", JSON.stringify(out, null, 2) + "\n");
          '
          cat latest.new.json
          # The upload directory holds exactly the two staging files and nothing else, so the local
          # name IS the remote name and `put` needs no path juggling. The previous attempt combined
          # lftp's -O and -o, which it rejected outright: three attempts and all the backoff sleeps
          # finished in 50 seconds, so nothing was ever transferred.
          UP="$RUNNER_TEMP/upload"
          rm -rf "$UP"; mkdir -p "$UP"
          cp "$ARTIFACT" "$UP/.staging-$STAMP.exe"
          cp latest.new.json "$UP/.staging-$STAMP.json"
          ls -la "$UP"
          attempt=1
          while :; do
            echo "==> uploading the staging pair (attempt $attempt/3)"
            if (cd "$UP" && lftp -u "$SFTP_USER," "sftp://$SFTP_HOST:$SFTP_PORT" -e \
                 "$LFTP_COMMON cd domains/api.genzdigitalstore.com/writehuman-agent; put -c .staging-$STAMP.exe; put -c .staging-$STAMP.json; bye"); then
              echo "==> staging pair uploaded"
              break
            fi
            if [ "$attempt" -ge 3 ]; then
              echo "::error::upload failed after 3 attempts; nothing was promoted"
              exit 1
            fi
            attempt=$((attempt + 1)); sleep $((attempt * 10))
          done
          # shellcheck disable=SC2086
          ssh $O "$SFTP_USER@$SFTP_HOST" "STAMP='$STAMP' WH_SIZE='$WH_SIZE' WH_SHA='$WH_SHA' bash -s" > promote.txt 2>promote.err <<'REMOTE'
          set -u
          D="$HOME/domains/api.genzdigitalstore.com/writehuman-agent"
          S="$D/.staging-$STAMP.exe"
          J="$D/.staging-$STAMP.json"
          sz="$(stat -c %s "$S")"; sh="$(sha256sum "$S" | cut -d' ' -f1)"
          echo "staged: $sz bytes sha256 $sh"
          if [ "$sz" != "$WH_SIZE" ] || [ "$sh" != "$WH_SHA" ]; then
            echo "STAGING_MISMATCH"; rm -f "$S" "$J"; exit 0
          fi
          echo "staging VERIFIED on the host"
          mv -f "$S" "$D/WriteHuman-Agent-Setup-x64.exe"
          mv -f "$J" "$D/latest.json"
          echo "post exe: $(stat -c %s "$D/WriteHuman-Agent-Setup-x64.exe") bytes sha256 $(sha256sum "$D/WriteHuman-Agent-Setup-x64.exe" | cut -d' ' -f1)"
          printf 'post meta: '; tr -d '\n' < "$D/latest.json"; echo
          echo "PROMOTED_OK"
          REMOTE
          cat promote.txt
          if grep -q STAGING_MISMATCH promote.txt; then
            echo "::error::the uploaded bytes did not hash to the manifest on the host; staging was deleted and NOTHING was promoted"; exit 1; fi
          grep -q PROMOTED_OK promote.txt || { echo "::error::promotion did not complete"; head -5 promote.err || true; exit 1; }
          { echo "## Promotion"; echo ''; echo '```'; cat promote.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # GATE 3 — the only claim that counts: what the PUBLIC route actually serves.
      - name: Verify the public download end to end
        if: ${{ inputs.confirm == 'PUBLISH' }}
        run: |
          set -euo pipefail
          O="-i $SSH_DIR/id_deploy -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$SSH_DIR/known_hosts -o BatchMode=yes -o ConnectTimeout=20 -p $SFTP_PORT"
          # shellcheck disable=SC2086
          ssh $O "$SFTP_USER@$SFTP_HOST" "WH_SIZE='$WH_SIZE' WH_SHA='$WH_SHA' WH_VERSION='$WH_VERSION' bash -s" > verify.txt 2>verify.err <<'REMOTE'
          set -u
          B="https://api.genzdigitalstore.com/api/crm/downloads/writehuman-agent/windows"
          D="$HOME/domains/api.genzdigitalstore.com/writehuman-agent"
          # WHAT IS ON DISK, RIGHT HERE, FIRST. The previous attempt promoted successfully and the
          # public route still answered 3.5.3, and with only the HTTP answer in hand there was no way
          # to tell "the files were not replaced" from "something in front of the route is serving a
          # cached answer". So state the disk truth beside the HTTP truth.
          echo "--- on disk now ---"
          echo "disk exe: $(stat -c %s "$D/WriteHuman-Agent-Setup-x64.exe") bytes sha256 $(sha256sum "$D/WriteHuman-Agent-Setup-x64.exe" | cut -d' ' -f1)"
          printf 'disk meta: '; tr -d '\n' < "$D/latest.json"; echo
          ls -la "$D" | head -10
          cd "$(mktemp -d)"
          # Parsed with grep, not node: a parse that silently returns empty reads as a mismatch and
          # sends a publish to rollback for the wrong reason, which is what happened last time.
          read_meta() {
            v="$(grep -oE '"version"[[:space:]]*:[[:space:]]*"[^"]+"' meta.json | head -1 | sed -E 's/.*"([^"]+)"$/\1/')"
            s="$(grep -oE '"size"[[:space:]]*:[[:space:]]*[0-9]+' meta.json | head -1 | grep -oE '[0-9]+$')"
            h="$(grep -oE '"sha256"[[:space:]]*:[[:space:]]*"[0-9a-f]{64}"' meta.json | head -1 | grep -oE '[0-9a-f]{64}')"
          }
          echo "--- metadata as a browser sees it (up to 4 tries, 15s apart) ---"
          v=""; s=""; h=""
          for i in 1 2 3 4; do
            curl -s -o meta.json -D mhdr.txt -w "try $i: latest.json HTTP %{http_code} %{content_type}\n" --max-time 30 "$B/latest.json?cb=$RANDOM"
            read_meta
            echo "  public says: version=$v size=$s sha256=$h"
            [ "$v" = "$WH_VERSION" ] && break
            sleep 15
          done
          tr -d '\n' < meta.json; echo
          echo "--- response headers in front of the route ---"
          grep -iE '^(HTTP/|cache-control|age|x-litespeed|cf-cache|x-cache|etag|last-modified)' mhdr.txt | tr -d '\r' | sed 's/^/  /'
          if [ "$v" = "$WH_VERSION" ] && [ "$s" = "$WH_SIZE" ] && [ "$h" = "$WH_SHA" ]; then echo "META_MATCHES"; else echo "META_MISMATCH"; fi
          echo "--- ONE COMPLETE STREAMED DOWNLOAD, hashed from the bytes ---"
          curl -s -D hdr.txt -o - --max-time 300 "$B/latest" | sha256sum | cut -d' ' -f1 > dl.sha
          echo "downloaded sha256: $(cat dl.sha)"
          grep -iE '^(HTTP/|content-length|content-type|content-disposition|x-agent-)' hdr.txt | tr -d '\r' | sed 's/^/  /'
          if [ "$(cat dl.sha)" = "$WH_SHA" ]; then echo "BYTES_MATCH"; else echo "BYTES_MISMATCH"; fi
          cl="$(grep -i '^content-length' hdr.txt | tr -d '\r' | awk '{print $2}' | tail -1)"
          if [ "$cl" = "$WH_SIZE" ]; then echo "LENGTH_MATCHES"; else echo "LENGTH_MISMATCH (content-length=$cl)"; fi
          echo "--- the member domains: metadata reachable with each Origin ---"
          for d in https://genzdigitalstore.com https://app.genzdigitalstore.com; do
            printf '%s -> ' "$d"
            curl -s -o /dev/null -D - -H "Origin: $d" --max-time 25 "$B/latest.json" | tr -d '\r' \
              | grep -iE '^(HTTP/|access-control-allow-origin|access-control-allow-credentials)' | tr '\n' ' '
            echo
          done
          REMOTE
          cat verify.txt
          { echo "## Public verification"; echo ''; echo '```'; cat verify.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          emit() { printf '::notice title=%s::%s\n' "$1" "$2"; }
          emit "on-disk"      "$(grep -m1 'disk exe:' verify.txt) | $(grep -m1 'disk meta:' verify.txt | cut -c1-240)"
          emit "public-meta"  "$(grep -E 'public says:' verify.txt | tail -1) | $(grep -m1 -E 'META_(MATCHES|MISMATCH)' verify.txt) | $(grep -iE '^  (cache-control|age|x-litespeed|cf-cache|x-cache)' verify.txt | tr '\n' ' ' | cut -c1-160)"
          emit "public-bytes" "$(grep -m1 'downloaded sha256:' verify.txt) | $(grep -m1 -E 'BYTES_(MATCH|MISMATCH)' verify.txt) | $(grep -m1 -E 'LENGTH_(MATCHES|MISMATCH)' verify.txt)"
          emit "headers"      "$(grep -iE 'x-agent-|content-disposition|content-length' verify.txt | tr '\n' '|' | cut -c1-400)"
          emit "domains"      "$(grep -E 'genzdigitalstore.com -> ' verify.txt | tr '\n' '|' | cut -c1-400)"
          ok=1
          grep -q META_MATCHES verify.txt || ok=0
          grep -q BYTES_MATCH  verify.txt || ok=0
          if [ "$ok" != "1" ]; then echo "::error::the public route does not serve the advertised bytes"; exit 1; fi

      # Only reached if the publish or its verification failed AFTER bytes were moved.
      - name: Roll back to the verified backup
        if: ${{ failure() && inputs.confirm == 'PUBLISH' && steps.backup.outcome == 'success' }}
        run: |
          set -uo pipefail
          O="-i $SSH_DIR/id_deploy -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$SSH_DIR/known_hosts -o BatchMode=yes -o ConnectTimeout=20 -p $SFTP_PORT"
          # shellcheck disable=SC2086
          ssh $O "$SFTP_USER@$SFTP_HOST" "STAMP='$STAMP' bash -s" > rb.txt 2>&1 <<'REMOTE'
          set -u
          D="$HOME/domains/api.genzdigitalstore.com/writehuman-agent"; B="$HOME/domains/api.genzdigitalstore.com/writehuman-agent-backup-$STAMP"
          if [ ! -d "$B" ]; then echo "NO_BACKUP_DIR"; exit 0; fi
          for f in WriteHuman-Agent-Setup-x64.exe latest.json; do
            if [ -f "$B/$f" ]; then cp -p "$B/$f" "$D/$f"; echo "restored $f $(sha256sum "$D/$f" | cut -d' ' -f1)"; fi
          done
          rm -f "$D/.staging-$STAMP.exe" "$D/.staging-$STAMP.json"
          echo "ROLLED_BACK"
          REMOTE
          cat rb.txt
          { echo "## Rollback"; echo ''; echo '```'; cat rb.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::publication was rolled back to the pre-publish files"
