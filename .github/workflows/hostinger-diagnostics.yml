# READ-ONLY Hostinger diagnostics. Measures the actual hosting account so resource claims can be
# evidence-based instead of asserted.
#
# WHAT THIS IS NOT: it writes nothing, restarts nothing, deletes nothing and installs nothing. Every
# command is a read. It is manual-dispatch only — never on push — and bounded by a job timeout and
# per-command timeouts so a slow host cannot hold the runner.
#
# It runs against the HOSTINGER ACCOUNT over the same pinned-host-key SSH used by the deploy, not
# against the GitHub runner (runner CPU/RAM says nothing about the shared host).
#
# SECRETS: never printed. The key goes to RUNNER_TEMP at 0600; host-key checking is strict and
# pinned, exactly as in deploy-frontend.yml. No .env, connection string, private log or customer
# data is read or echoed — the MySQL section uses SHOW STATUS only, via the credentials already on
# the host, and prints counters, never values.
name: Hostinger diagnostics (read-only)

on:
  workflow_dispatch:
    inputs:
      note:
        description: 'Why this sample was taken (recorded in the summary)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: hostinger-diagnostics
  cancel-in-progress: false

env:
  SFTP_HOST: '147.79.103.253'
  SFTP_PORT: '65002'
  SFTP_USER: 'u171982351'
  API_ROOT: '/home/u171982351/domains/api.genzdigitalstore.com/nodejs'
  MAIN_WEB: '/home/u171982351/domains/genzdigitalstore.com/public_html'
  APP_WEB: '/home/u171982351/domains/app.genzdigitalstore.com/public_html'

jobs:
  measure:
    name: Measure the hosting account
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Install deploy key and PINNED host key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.HOSTINGER_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_PRIVATE_KEY:-}" ] || [ -z "${SSH_KNOWN_HOSTS:-}" ]; then
            echo "::error::HOSTINGER_SSH_PRIVATE_KEY and HOSTINGER_SSH_KNOWN_HOSTS must both be set in the 'production' environment."
            exit 1
          fi
          D="$RUNNER_TEMP/diag-ssh"
          mkdir -p "$D" && chmod 700 "$D"
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$D/id_deploy"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$D/known_hosts"
          chmod 600 "$D/id_deploy" "$D/known_hosts"
          ssh-keygen -F "[${SFTP_HOST}]:${SFTP_PORT}" -f "$D/known_hosts" >/dev/null \
            || { echo "::error::the pinned host key does not cover [${SFTP_HOST}]:${SFTP_PORT}"; exit 1; }
          echo "SSH_DIR=$D" >> "$GITHUB_ENV"

      - name: Unlock the key if encrypted
        env:
          SSH_PASSPHRASE: ${{ secrets.HOSTINGER_SSH_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_PASSPHRASE:-}" ]; then echo "key treated as unencrypted"; exit 0; fi
          eval "$(ssh-agent -s)" >/dev/null
          ASK="$SSH_DIR/askpass.sh"; umask 077
          printf '#!/usr/bin/env bash\nprintf "%%s\\n" "$SSH_PASSPHRASE"\n' > "$ASK"; chmod 700 "$ASK"
          SSH_ASKPASS="$ASK" SSH_ASKPASS_REQUIRE=force DISPLAY=:0 ssh-add "$SSH_DIR/id_deploy" >/dev/null 2>&1 \
            || { echo "::error::ssh-add rejected the key"; exit 1; }
          rm -f "$ASK"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"

      # TARGETED, READ-ONLY: the two questions this release actually turns on. Writes nothing,
      # reads no .env value (only whether a key is present), hashes the published installer once so
      # the reported SHA-256 is measured rather than assumed.
      - name: WriteHuman download + device-state facts (read-only)
        run: |
          set -uo pipefail
          O="-i $SSH_DIR/id_deploy -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$SSH_DIR/known_hosts -o BatchMode=yes -o ConnectTimeout=20 -p $SFTP_PORT"
          # shellcheck disable=SC2086
          ssh $O "$SFTP_USER@$SFTP_HOST" 'bash -s' > wh.txt 2>wh.err <<'REMOTE'
          set -u
          say() { printf '\n===== %s =====\n' "$1"; }
          # EXPORTED, not a plain shell variable: run() executes each probe through `bash -c`, which
          # is a fresh shell. An unexported API expanded to the empty string there, so every
          # `test -f "$API/..."` tested /routes/... at the filesystem ROOT and reported MISSING.
          # Two earlier runs drew conclusions from exactly that artifact. HOME worked only because
          # the environment exports it.
          run() { timeout 120 bash -c "$1" 2>&1 | head -40 || echo "(unavailable)"; }
          export API="$HOME/domains/api.genzdigitalstore.com/nodejs"

          say "1. PUBLISHED INSTALLER DIRECTORY (WH_AGENT_DIST_DIR default ~/writehuman-agent)"
          run 'ls -la "$HOME/writehuman-agent" 2>&1 || echo "DIRECTORY DOES NOT EXIST"'
          run 'test -f "$HOME/writehuman-agent/latest.json" && echo "--- latest.json ---" && cat "$HOME/writehuman-agent/latest.json" || echo "NO latest.json"'
          run 'E="$HOME/writehuman-agent/WriteHuman-Agent-Setup-x64.exe"; if [ -f "$E" ]; then echo "exe bytes: $(stat -c %s "$E")"; echo "exe sha256: $(sha256sum "$E" | cut -d" " -f1)"; else echo "NO EXE AT THE DEFAULT PATH"; fi'
          run 'echo "is WH_AGENT_DIST_DIR overridden? (presence only, no value):"; for f in "$API/.env" "$HOME/.env"; do [ -f "$f" ] && echo "  $f -> $(grep -c "^WH_AGENT_DIST_DIR=" "$f" 2>/dev/null) matching key(s)"; done'
          run 'find "$HOME" -maxdepth 2 -name "WriteHuman-Agent-Setup*.exe" -printf "%p\t%s bytes\n" 2>/dev/null | head -10 || true'

          say "2a. WHICH DIRECTORY IS THE RUNNING NODE PROCESS ACTUALLY EXECUTING FROM?"
          # Two earlier runs were invalidated by guesses about this path, and the third resolved it
          # with `find | head -1`, which returned /home/.../wh-rollback-20260829-212153 — a ROLLBACK
          # SNAPSHOT. Every marker count from that run described the snapshot, not the running code.
          # The process table is the only authority on what is running: /proc/<pid>/cwd.
          run 'for p in $(pgrep -u "$(whoami)" node 2>/dev/null | head -6); do printf "pid %s cwd=%s args=%s\n" "$p" "$(readlink -f /proc/$p/cwd 2>/dev/null || echo "?")" "$(tr "\0" " " < /proc/$p/cmdline 2>/dev/null | cut -c1-110)"; done; echo "node pids: $(pgrep -u "$(whoami)" -c node 2>/dev/null || echo 0)"'
          run 'ls -la "$HOME/domains/api.genzdigitalstore.com/nodejs" 2>&1 | head -30'
          run 'ls -la "$HOME/domains/api.genzdigitalstore.com/nodejs/routes/admin" 2>&1 | head -20'
          run 'find "$HOME" -maxdepth 8 -path "*/routes/admin/proxyTools.js" -printf "%p\t%s\t%TY-%Tm-%Td\n" 2>/dev/null | head -8'

          say "2. DEPLOYED BACKEND REVISION — does the RUNNING code decorate devices[].state?"
          # Resolve from the live process first; fall back to the domains path, and NEVER to a
          # rollback/backup snapshot.
          CW="$(for p in $(pgrep -u "$(whoami)" node 2>/dev/null); do c="$(readlink -f /proc/$p/cwd 2>/dev/null)"; [ -f "$c/server-crm.js" ] && echo "$c" && break; done)"
          if [ -n "${CW:-}" ]; then export API="$CW"; else export API="$HOME/domains/api.genzdigitalstore.com/nodejs"; fi
          export APISRC="$([ -n "${CW:-}" ] && echo "live /proc cwd" || echo "domains path (no node process matched)")"
          run 'echo "API root: $API  (source: $APISRC)"'
          run 'F="$API/routes/admin/proxyTools.js"; if [ -f "$F" ]; then echo "proxyTools.js $(stat -c %s "$F") bytes mtime $(stat -c %y "$F" | cut -c1-19)"; else echo "proxyTools.js MISSING under $API"; fi'
          run 'F="$API/routes/admin/proxyTools.js"; printf "markers:"; for pat in "dv.state = st.state" "dv.stateReason" "dv.canActivate" "deviceViewsAll" "respondIfDbBusy" "EXPECTED_AGENT_VERSION" "stateOf(" "agentOutdated"; do printf " %s=%s" "$pat" "$(grep -c -F "$pat" "$F" 2>/dev/null || echo 0)"; done; echo'
          run 'printf "modules:"; for m in routes/proxy/agentDownload.js db/poolLimits.js utils/proxy/deviceState.js utils/proxy/deviceSync.js; do printf " %s=%s" "$(basename "$m")" "$([ -f "$API/$m" ] && echo yes || echo NO)"; done; echo'
          run 'F="$API/utils/proxy/deviceState.js"; [ -f "$F" ] && printf "deviceState.js %s bytes mtime %s stateOf=%s\n" "$(stat -c %s "$F")" "$(stat -c %y "$F" | cut -c1-19)" "$(grep -c "stateOf" "$F")" || echo "deviceState.js absent"'
          run 'F="$API/utils/proxy/deviceSync.js"; [ -f "$F" ] && printf "deviceSync.js %s bytes mtime %s publicDevice=%s\n" "$(stat -c %s "$F")" "$(stat -c %y "$F" | cut -c1-19)" "$(grep -c "publicDevice" "$F")" || echo "deviceSync.js absent"'
          run 'echo "agent-state route shape:"; grep -n -m6 -E "devices:|deviceViews|state:|stateReason" "$API/routes/admin/proxyTools.js" 2>/dev/null | cut -c1-120'

          say "3. PUBLIC DOWNLOAD ROUTE, AS THE BROWSER SEES IT"
          run 'curl -s -o /dev/null -w "latest.json -> HTTP %{http_code} (%{content_type})\n" --max-time 25 https://api.genzdigitalstore.com/api/crm/downloads/writehuman-agent/windows/latest.json'
          run 'curl -s --max-time 25 https://api.genzdigitalstore.com/api/crm/downloads/writehuman-agent/windows/latest.json | tr -d "\n " | head -c 400; echo'
          run 'curl -s -o /dev/null -D - --max-time 30 -r 0-0 https://api.genzdigitalstore.com/api/crm/downloads/writehuman-agent/windows/latest | tr -d "\r" | grep -iE "^HTTP/|content-type:|content-disposition:|x-agent-|content-range:" | head -8'

          say "4. SERVED FRONTEND BUILD ON BOTH ROOTS"
          run 'for d in https://genzdigitalstore.com https://app.genzdigitalstore.com; do printf "%s -> " "$d"; curl -s --max-time 20 "$d/build-source.json?cb=$RANDOM" | tr -d " \n" | head -c 180; echo; done'
          REMOTE
          RC=$?
          echo "ssh exit=$RC"
          if [ ! -s wh.txt ]; then echo "::error::no output"; head -5 wh.err || true; exit 1; fi
          if grep -qiE 'BEGIN [A-Z ]*PRIVATE KEY|mysql://|DATABASE_URL=|JWT_SECRET=' wh.txt; then
            echo "::error::captured output matched a secret-shaped pattern; not publishing it"; exit 1; fi
          { echo "## WriteHuman download + device-state facts"; echo ''; echo '```'; cat wh.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          cat wh.txt

          # Raw logs and job summaries are not retrievable from this client; ::notice:: annotations
          # are. GitHub keeps at most TEN notice annotations per step, and the previous run emitted
          # seventeen — the seven that mattered least silently vanished. This step now emits NINE,
          # each a fact this run exists to establish.
          emit() { printf '::notice title=%s::%s\n' "$1" "$2"; }
          val() { grep -m1 -E "$1" wh.txt | tr -d '\r' | cut -c1-420; }
          emit "node-procs"    "$(grep -m3 -E '^pid [0-9]+ cwd=' wh.txt | tr '\n' '|' | cut -c1-420)"
          emit "api-root"      "$(val '^API root:')"
          emit "proxyTools"    "$(val 'proxyTools.js [0-9]+ bytes|proxyTools.js MISSING')"
          emit "state-markers" "$(val '^markers:')"
          emit "modules"       "$(val '^modules:')"
          emit "device-utils"  "$(val 'deviceState.js')  ::  $(val 'deviceSync.js')"
          emit "route-shape"   "$(sed -n '/agent-state route shape:/,/^=====/p' wh.txt | grep -m5 -E '^ *[0-9]+:' | tr '\n' '|' | cut -c1-420)"
          emit "public-dl"     "$(val 'latest.json -> HTTP')  $(grep -m1 -oE '"version":"[^"]+","size":[0-9]+' wh.txt)  $(grep -m1 -oiE 'x-agent-version:.*|x-agent-sha256:.*' wh.txt | cut -c1-90)"
          emit "served-build"  "$(grep -m2 -E 'genzdigitalstore.com -> ' wh.txt | tr '\n' '|' | cut -c1-420)"

      - name: Pin the deployed backend revision (read-only)
        run: |
          set -uo pipefail
          O="-i $SSH_DIR/id_deploy -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$SSH_DIR/known_hosts -o BatchMode=yes -o ConnectTimeout=20 -p $SFTP_PORT"
          # shellcheck disable=SC2086
          ssh $O "$SFTP_USER@$SFTP_HOST" 'bash -s' > rev.txt 2>rev.err <<'REMOTE'
          set -u
          run() { timeout 120 bash -c "$1" 2>&1 | head -30 || echo "(unavailable)"; }
          # The app does NOT run from ~/domains/<host>/nodejs. hPanel serves it from
          # hbuilds/current -> hbuilds/versions/<uuid>/nodejs, which is why three earlier runs read
          # a stale tree. Resolve it the same way the process table did.
          CW="$(for p in $(pgrep -u "$(whoami)" node 2>/dev/null); do c="$(readlink -f /proc/$p/cwd 2>/dev/null)"; [ -f "$c/server-crm.js" ] && echo "$c" && break; done)"
          export API="${CW:-$HOME/domains/api.genzdigitalstore.com/nodejs}"
          run 'echo "API=$API"'
          run 'L="$HOME/domains/api.genzdigitalstore.com/hbuilds/current"; printf "current -> %s\n" "$(readlink -f "$L" 2>/dev/null || echo "(no such link)")"'
          # File identity, so the deployed revision can be matched against repo blobs offline.
          run 'cd "$API" && for f in routes/admin/proxyTools.js utils/proxy/deviceState.js utils/proxy/deviceSync.js routes/proxy/agentDownload.js server-crm.js; do if [ -f "$f" ]; then printf "%s %s %s\n" "$(sha256sum "$f" | cut -c1-16)" "$(stat -c %s "$f")" "$f"; else printf "ABSENT %s\n" "$f"; fi; done'
          # What the running route actually emits for a device, verbatim from the deployed file.
          run 'cd "$API" && grep -n -E "dv\.state|dv\.stateReason|dv\.canActivate|stateOf\(|healthSignals" routes/admin/proxyTools.js | head -14 | cut -c1-150'
          run 'cd "$API" && printf "contract:"; for pat in healthSignals EXPECTED_AGENT_VERSION agentOutdated expectedAgentVersion telemetryFrozen onlineDeviceCount; do printf " %s=%s" "$pat" "$(grep -c -F "$pat" routes/admin/proxyTools.js)"; done; echo'
          run 'cd "$API" && printf "deviceState states: "; grep -m1 -E "^const STATES" utils/proxy/deviceState.js | cut -c1-140; printf "UNKNOWN in deviceState.js: %s\n" "$(grep -c -w UNKNOWN utils/proxy/deviceState.js)"'
          run 'cd "$API" && printf "publicDevice fields: "; sed -n "/function publicDevice/,/^}/p" utils/proxy/deviceSync.js | grep -oE "^ *[a-zA-Z]+:" | tr -d " :" | tr "\n" " " | cut -c1-300; echo'
          run 'cd "$API" && ls -la | head -20'
          run 'cd "$API" && test -f build-source.json && cat build-source.json | tr -d "\n " | cut -c1-240 || echo "(no backend build stamp)"'
          REMOTE
          RC=$?; echo "ssh exit=$RC"
          if [ ! -s rev.txt ]; then echo "::error::no output"; head -5 rev.err || true; exit 1; fi
          if grep -qiE 'BEGIN [A-Z ]*PRIVATE KEY|mysql://|DATABASE_URL=|JWT_SECRET=' rev.txt; then
            echo "::error::captured output matched a secret-shaped pattern; not publishing it"; exit 1; fi
          { echo "## Deployed backend revision"; echo ''; echo '```'; cat rev.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          cat rev.txt
          emit() { printf '::notice title=%s::%s\n' "$1" "$2"; }
          emit "api"        "$(grep -m1 '^API=' rev.txt)  $(grep -m1 'current ->' rev.txt)"
          emit "hashes"     "$(grep -E '\.js$' rev.txt | tr '\n' '|' | cut -c1-420)"
          emit "emit-lines" "$(grep -m6 -E '^[0-9]+: *(dv\.|.*stateOf\()' rev.txt | tr '\n' '|' | cut -c1-420)"
          emit "contract"   "$(grep -m1 '^contract:' rev.txt | cut -c1-420)"
          emit "dstates"    "$(grep -m1 'deviceState states:' rev.txt | cut -c1-300)  $(grep -m1 'UNKNOWN in deviceState' rev.txt)"
          emit "pubfields"  "$(grep -m1 'publicDevice fields:' rev.txt | cut -c1-420)"
          emit "api-stamp"  "$(grep -m1 -E 'sourceFingerprint|no backend build stamp' rev.txt | cut -c1-300)"

      - name: Collect read-only measurements
        env:
          # Via env, never `${{ }}` inside the script: a workflow_dispatch input interpolated into
          # a shell block is a command-injection vector, even on a manual-only workflow.
          DIAG_NOTE: ${{ inputs.note }}
        run: |
          set -uo pipefail
          O="-i $SSH_DIR/id_deploy -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$SSH_DIR/known_hosts -o BatchMode=yes -o ConnectTimeout=20 -p $SFTP_PORT"
          STAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # One SSH session, one heredoc: fewer entry processes than a command per metric, which
          # matters on a host whose process ceiling is the thing being measured.
          # shellcheck disable=SC2086
          ssh $O "$SFTP_USER@$SFTP_HOST" 'bash -s' > diag.txt 2>diag.err <<'REMOTE'
          set -u
          say() { printf '\n===== %s =====\n' "$1"; }
          run() { timeout 25 bash -c "$1" 2>&1 | head -40 || echo "(unavailable)"; }

          say "IDENTITY AND PLAN"
          run 'whoami; hostname; uname -sr'
          run 'cat /etc/*release 2>/dev/null | head -3'
          run 'command -v hpanel >/dev/null && echo hpanel-cli-present || echo "no hpanel CLI (plan limits must come from the panel)"'

          say "CLOUDLINUX LVE LIMITS AND USAGE (account-wide)"
          run 'command -v lvectl >/dev/null && lvectl list 2>/dev/null | head -5 || echo "(lvectl not available to this user)"'
          run 'command -v lveinfo >/dev/null && lveinfo --period=today --show-columns EP,CPU,MEM 2>/dev/null | head -10 || echo "(lveinfo not available)"'
          run 'cat /proc/user_beancounters 2>/dev/null | head -20 || echo "(no user_beancounters)"'

          say "PROCESSES: ACCOUNT-WIDE vs THIS APPLICATION"
          run 'ps -u "$(whoami)" -o pid,etimes,pcpu,pmem,rss,comm --sort=-rss | head -25'
          run 'echo "account process count: $(ps -u "$(whoami)" --no-headers | wc -l)"'
          run 'echo "node processes: $(pgrep -u "$(whoami)" -c node 2>/dev/null || echo 0)"'
          run 'ps -u "$(whoami)" -o pid,etimes,rss,args --sort=-rss | grep -i "[n]ode" | head -10'

          say "MEMORY AND LOAD (shared host — context only)"
          run 'free -m 2>/dev/null | head -3'
          run 'cat /proc/loadavg'

          say "DISK AND INODES"
          run 'df -h "$HOME" | tail -2'
          run 'df -i "$HOME" | tail -2'
          run 'du -sh "$HOME" 2>/dev/null'
          run 'for d in domains/genzdigitalstore.com/public_html domains/app.genzdigitalstore.com/public_html domains/api.genzdigitalstore.com/nodejs deploy-backups; do [ -e "$HOME/$d" ] && printf "%s\t%s\t%s files\n" "$(du -sh "$HOME/$d" 2>/dev/null | cut -f1)" "$d" "$(find "$HOME/$d" -type f 2>/dev/null | wc -l)"; done'

          say "ACCUMULATED HASHED BUILD ASSETS (not deleted — rollback and open clients need them)"
          run 'for w in domains/genzdigitalstore.com/public_html domains/app.genzdigitalstore.com/public_html; do [ -d "$HOME/$w/static/js" ] && printf "%s: %s js chunks, %s\n" "$w" "$(find "$HOME/$w/static/js" -name "*.js" | wc -l)" "$(du -sh "$HOME/$w/static" | cut -f1)"; done'
          run 'ls -1 "$HOME/domains/app.genzdigitalstore.com/public_html/static/js"/main.*.js 2>/dev/null | tail -8'
          run 'ls -1dt "$HOME/deploy-backups"/* 2>/dev/null | head -10; echo "backup total: $(du -sh "$HOME/deploy-backups" 2>/dev/null | cut -f1)"'

          say "NODE APPLICATION: RESTARTS AND MEMORY EXHAUSTION"
          run 'ls -la "$HOME/domains/api.genzdigitalstore.com/nodejs/tmp/restart.txt" 2>/dev/null || echo "(no passenger restart marker)"'
          run 'find "$HOME" -maxdepth 3 -name "*.log" -newermt "-7 days" -printf "%p\t%s bytes\t%TY-%Tm-%Td\n" 2>/dev/null | head -15'
          run 'grep -rliE "out of memory|heap out of memory|killed" "$HOME"/logs 2>/dev/null | head -5 || echo "(no accessible OOM evidence)"'

          say "ENDPOINT RATES AND ERROR CODES (access logs, if readable)"
          run 'ls -la "$HOME"/logs 2>/dev/null | head -15 || echo "(no ~/logs directory — rates must come from the panel)"'
          run 'L=$(ls -1t "$HOME"/logs/*access*log 2>/dev/null | head -1); [ -n "$L" ] && { echo "log: $L"; echo "lines: $(wc -l < "$L")"; echo "--- status codes ---"; awk "{print \$9}" "$L" | sort | uniq -c | sort -rn | head -10; echo "--- top endpoints ---"; awk "{print \$7}" "$L" | sed "s/?.*//" | sort | uniq -c | sort -rn | head -15; } || echo "(no readable access log)"'
          run 'L=$(ls -1t "$HOME"/logs/*access*log 2>/dev/null | head -1); [ -n "$L" ] && { echo "--- 502/503 count ---"; awk "\$9==502||\$9==503" "$L" | wc -l; } || true'

          say "MYSQL: CONNECTIONS AND QUEUE BEHAVIOUR (SHOW STATUS only — counters, never values)"
          run 'command -v mysql >/dev/null && echo mysql-client-present || echo "(no mysql client)"'
          run 'command -v mysql >/dev/null && mysql --defaults-file="$HOME/.my.cnf" -N -e "SHOW GLOBAL STATUS WHERE Variable_name IN (\"Threads_connected\",\"Threads_running\",\"Max_used_connections\",\"Aborted_connects\",\"Connection_errors_max_connections\",\"Slow_queries\",\"Questions\",\"Uptime\")" 2>/dev/null || echo "(no usable ~/.my.cnf — MySQL counters need credentials this diagnostic will not read from app config)"'
          run 'command -v mysql >/dev/null && mysql --defaults-file="$HOME/.my.cnf" -N -e "SHOW GLOBAL VARIABLES WHERE Variable_name IN (\"max_connections\",\"max_user_connections\",\"wait_timeout\",\"slow_query_log\")" 2>/dev/null || true'

          say "CRON AND BACKGROUND JOBS (duplication across workers)"
          run 'crontab -l 2>/dev/null | grep -v "^#" | head -20 || echo "(no crontab for this user)"'

          say "SAMPLE TAKEN"
          run 'date -u +%Y-%m-%dT%H:%M:%SZ'
          REMOTE
          RC=$?
          echo "ssh exit=$RC"
          if [ "$RC" -ne 0 ] && [ ! -s diag.txt ]; then
            echo "::error::diagnostics session failed and produced no output"
            head -5 diag.err || true
            exit 1
          fi
          # Defence in depth: the collector reads no secrets, but scan the captured text before it
          # is published to the job summary, and stop rather than print a match.
          if grep -qiE 'BEGIN [A-Z ]*PRIVATE KEY|password[[:space:]]*=|mysql://|DATABASE_URL|JWT_SECRET|[A-Za-z0-9+/]{40,}={0,2}$' diag.txt; then
            echo "::error::captured output matched a secret-shaped pattern; not publishing it"
            exit 1
          fi
          {
            echo "## Hostinger read-only sample — $STAMP"
            echo ""
            [ -n "${DIAG_NOTE:-}" ] && printf '_Reason: %s_\n\n' "$DIAG_NOTE"
            echo '```'
            cat diag.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "---- collected ----"
          cat diag.txt
